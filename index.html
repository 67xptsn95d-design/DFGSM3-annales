                questions: cleanQuestions
              };
              await saveGroup(grpDoc);
            }

            state.importDraft = null;
            state.undoStack = [];
            state.redoStack = [];
            state.view = 'explorer';
            showToast(`${validGroups.length} groupe(s) enregistré(s) !`, 'success');
            render();
          };

          const btnSaveTop = document.getElementById('btn-save-import-all');
          const btnSaveBot = document.getElementById('btn-save-import-bottom');
          if (btnSaveTop) btnSaveTop.onclick = saveAllDraft;
          if (btnSaveBot) btnSaveBot.onclick = saveAllDraft;
        }

        // Quiz events
        if (state.view === 'quiz' && state.quiz) {
          const item = state.quiz.questions[state.quiz.currentIndex];

          document.querySelectorAll('[data-quiz-jump]').forEach(btn => {
            btn.onclick = () => {
              state.quiz.currentIndex = Number(btn.dataset.quizJump);
              window.scrollTo({ top: 0, behavior: 'smooth' });
              render();
            };
          });

          document.querySelectorAll('[data-toggle-choice]').forEach(btn => {
            btn.onclick = () => {
              if (item.validated) return;
              const letter = btn.dataset.toggleChoice;
              if (item.question.type === 'QCU') {
                item.selectedOrigLetters = [letter];
              } else {
                const set = new Set(item.selectedOrigLetters);
                if (set.has(letter)) set.delete(letter); else set.add(letter);
                item.selectedOrigLetters = Array.from(set);
              }
              render();
            };
          });

          const openInp = document.getElementById('quiz-open-input');
          if (openInp) openInp.oninput = () => { item.textResponse = openInp.value; };

          const btnVal = document.getElementById('btn-validate-q');
          if (btnVal) btnVal.onclick = () => validateCurrentQuizQuestion();

          document.querySelectorAll('[data-self-grade]').forEach(btn => {
            btn.onclick = () => {
              item.score = Number(btn.dataset.selfGrade);
              render();
            };
          });

          const btnToggleModel = document.getElementById('btn-toggle-edit-model');
          if (btnToggleModel) btnToggleModel.onclick = () => {
            item.editingModelAnswer = !item.editingModelAnswer;
            render();
          };

          const btnSaveModel = document.getElementById('btn-save-inline-model');
          if (btnSaveModel) btnSaveModel.onclick = async () => {
            const val = document.getElementById('inline-model-textarea').value;
            item.question.modelAnswer = val;
            item.editingModelAnswer = false;
            await updateQuestionInGroup(item.groupId, item.question.id, { modelAnswer: val });
            showToast('Correction personnelle sauvegardée.', 'success');
            render();
          };

          const btnToggleNotes = document.getElementById('btn-toggle-edit-notes');
          if (btnToggleNotes) btnToggleNotes.onclick = () => {
            item.editingNotes = !item.editingNotes;
            render();
          };

          const btnSaveNotes = document.getElementById('btn-save-inline-notes');
          if (btnSaveNotes) btnSaveNotes.onclick = async () => {
            const val = document.getElementById('inline-notes-textarea').value;
            item.question.courseNotes = val;
            item.editingNotes = false;
            await updateQuestionInGroup(item.groupId, item.question.id, { courseNotes: val });
            showToast('Notes de cours sauvegardées.', 'success');
            render();
          };

          const btnQuickEdit = document.getElementById('btn-quick-edit-q');
          if (btnQuickEdit) btnQuickEdit.onclick = () => openQuickEditQuestionModal(state.quiz.currentIndex);

          const btnPrev = document.getElementById('btn-prev-q');
          if (btnPrev) btnPrev.onclick = () => {
            if (state.quiz.currentIndex > 0) {
              state.quiz.currentIndex--;
              window.scrollTo({ top: 0, behavior: 'smooth' });
              render();
            }
          };

          const btnNext = document.getElementById('btn-next-q');
          if (btnNext) btnNext.onclick = () => {
            if (state.quiz.currentIndex < state.quiz.questions.length - 1) {
              state.quiz.currentIndex++;
              window.scrollTo({ top: 0, behavior: 'smooth' });
              render();
            }
          };

          const btnFinTop = document.getElementById('btn-finish-quiz-top');
          const btnFinBot = document.getElementById('btn-finish-quiz-bottom');
          if (btnFinTop) btnFinTop.onclick = () => finishQuizAndSave();
          if (btnFinBot) btnFinBot.onclick = () => finishQuizAndSave();

          const btnQuit = document.getElementById('btn-quit-quiz');
          if (btnQuit) btnQuit.onclick = () => {
            openConfirmModal(
              'Quitter la série en cours ?',
              'Votre progression sur cet entraînement ne sera pas enregistrée.',
              'Quitter',
              () => {
                state.quiz = null;
                state.view = 'explorer';
                render();
              },
              true
            );
          };
        }

        // Résultats & relecture
        if (state.view === 'results' || state.view === 'reviewAttempt') {
          const att = state.view === 'results' ? state.lastAttempt : state.reviewAttempt;
          const btnBack = document.getElementById('btn-results-back');
          if (btnBack) btnBack.onclick = () => {
            state.view = state.view === 'reviewAttempt' ? 'history' : 'explorer';
            render();
          };
          const btnRetry = document.getElementById('btn-retry-errors');
          if (btnRetry) btnRetry.onclick = () => launchRetryErrors(att);
        }

        // Historique
        if (state.view === 'history') {
          const selSem = document.getElementById('hist-filter-sem');
          if (selSem) selSem.onchange = () => {
            state.historyFilter.semesterId = selSem.value;
            state.historyFilter.ueId = 'all';
            render();
          };
          const selUe = document.getElementById('hist-filter-ue');
          if (selUe) selUe.onchange = () => {
            state.historyFilter.ueId = selUe.value;
            render();
          };

          document.querySelectorAll('[data-review-attempt]').forEach(btn => {
            btn.onclick = () => {
              const att = state.attempts.find(a => a.id === btn.dataset.reviewAttempt);
              if (att) {
                state.reviewAttempt = att;
                state.view = 'reviewAttempt';
                window.scrollTo({ top: 0, behavior: 'smooth' });
                render();
              }
            };
          });

          document.querySelectorAll('[data-retry-attempt]').forEach(btn => {
            btn.onclick = () => {
              const att = state.attempts.find(a => a.id === btn.dataset.retryAttempt);
              if (att) launchRetryErrors(att);
            };
          });

          document.querySelectorAll('[data-del-attempt]').forEach(btn => {
            btn.onclick = () => {
              openConfirmModal(
                'Supprimer cette copie de l\'historique ?',
                'Cette action est irréversible.',
                'Supprimer',
                () => deleteAttempt(btn.dataset.delAttempt),
                true
              );
            };
          });
        }

        // Lightbox
        document.querySelectorAll('[data-zoom-src]').forEach(el => {
          el.onclick = () => openLightbox(el.dataset.zoomSrc);
        });
      }

      // Raccourci clavier Ctrl+Z / Cmd+Z pour Annuler (Undo) dans l'éditeur
      window.addEventListener('keydown', (e) => {
        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z' && !e.shiftKey) {
          if (state.view === 'import' || state.view === 'editGroup') {
            const active = document.activeElement;
            const isTextInput = active && (active.tagName === 'TEXTAREA' || (active.tagName === 'INPUT' && active.type === 'text'));
            if (!isTextInput && state.undoStack.length > 0) {
              e.preventDefault();
              performUndo();
            }
          }
        }
      });

      window.addEventListener('DOMContentLoaded', () => {
        loadAllFromStorage();
      });
    })();
  </script>
</body>
</html>
