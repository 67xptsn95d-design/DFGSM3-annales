              <div class="space-y-6">
                ${draft.groups.map((grp, gIdx) => `
                  <section class="rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 shadow-sm overflow-hidden">
                    <div class="p-4 sm:p-5 bg-slate-50 dark:bg-slate-800/60 border-b border-slate-200 dark:border-slate-800 space-y-3">
                      <div>
                        <label class="block text-[11px] font-bold uppercase tracking-wider text-blue-600 dark:text-blue-400 mb-1">
                          Titre du groupe ${gIdx + 1} (${grp.questions.length} question${grp.questions.length > 1 ? 's' : ''})
                        </label>
                        <input type="text" data-draft-grp-title="${gIdx}" value="${escapeHtml(grp.title)}"
                          placeholder="Nom libre du groupe…"
                          class="w-full px-3.5 py-2 rounded-xl border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-900 text-sm font-bold focus:ring-2 focus:ring-blue-500 focus:outline-none" />
                      </div>

                      ${renderGroupDestinationControls(grp, gIdx)}

                      <div class="flex flex-wrap items-center gap-2 pt-1">
                        ${gIdx > 0 ? `
                          <button type="button" data-merge-grp="${gIdx}" class="px-3 py-1.5 rounded-xl text-xs font-semibold bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-700 hover:border-blue-500">
                            ↑ Fusionner avec le groupe ${gIdx}
                          </button>
                        ` : ''}
                        <button type="button" data-add-q-grp="${gIdx}" class="px-3 py-1.5 rounded-xl text-xs font-semibold bg-blue-50 dark:bg-blue-950/60 text-blue-700 dark:text-blue-300 hover:bg-blue-100">
                          + Ajouter une question
                        </button>
                        ${draft.groups.length > 1 ? `
                          <button type="button" data-del-grp="${gIdx}" class="px-3 py-1.5 rounded-xl text-xs font-semibold text-red-600 hover:bg-red-50 dark:hover:bg-red-950/40">
                            Supprimer ce groupe
                          </button>
                        ` : ''}
                      </div>
                    </div>

                    <div class="divide-y divide-slate-200 dark:divide-slate-800">
                      ${grp.questions.map((q, qIdx) => {
                        const isChoice = q.type === 'QCM' || q.type === 'QCU';
                        const media = normalizeQuestionMedia(q);
                        q.imageIds = media.imageIds;
                        q.correctionImageIds = media.correctionImageIds;
                        q.correctAnswers = media.correctAnswers;
                        q.toleratedAnswers = media.toleratedAnswers;

                        return `
                          <div class="p-4 sm:p-5 space-y-3">
                            <div class="flex flex-wrap items-center justify-between gap-2">
                              <div class="flex flex-wrap items-center gap-2">
                                <span class="px-2.5 py-1 rounded-lg text-xs font-extrabold bg-[#1E3A5F] text-white">Q${q.origNumber}</span>
                                <select data-dq-type="${gIdx}|${qIdx}" class="px-2.5 py-1 rounded-lg text-xs font-bold border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800">
                                  ${Object.keys(QUESTION_TYPES).map(t => `<option value="${t}" ${q.type === t ? 'selected' : ''}>${t}</option>`).join('')}
                                </select>
                                <input type="text" data-dq-sub="${gIdx}|${qIdx}" value="${escapeHtml(q.subtitle || '')}"
                                  placeholder="Sous-titre / Prof (optionnel)"
                                  class="px-2.5 py-1 rounded-lg text-xs border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 w-44 sm:w-52" />
                              </div>

                              <div class="flex flex-wrap items-center gap-1.5">
                                ${draft.groups.length > 1 ? `
                                  <select data-move-q="${gIdx}|${qIdx}" title="Déplacer vers un autre groupe"
                                    class="px-2 py-1 rounded-lg text-[11px] font-semibold border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800">
                                    <option value="">Déplacer vers…</option>
                                    ${draft.groups.map((targetG, tIdx) => tIdx !== gIdx ? `<option value="${tIdx}">→ Groupe ${tIdx + 1} (${escapeHtml(targetG.title.slice(0, 20))})</option>` : '').join('')}
                                  </select>
                                ` : ''}
                                ${qIdx > 0 ? `
                                  <button type="button" data-split-grp="${gIdx}|${qIdx}"
                                    class="px-2.5 py-1 rounded-lg text-[11px] font-semibold bg-amber-50 dark:bg-amber-950/50 text-amber-800 dark:text-amber-300 border border-amber-200 dark:border-amber-800 hover:bg-amber-100">
                                    ✂ Scinder ici
                                  </button>
                                ` : ''}
                                <button type="button" data-del-dq="${gIdx}|${qIdx}" class="px-2 py-1 rounded-lg text-xs text-red-600 hover:bg-red-50 dark:hover:bg-red-950/40" title="Supprimer">
                                  ✕
                                </button>
                              </div>
                            </div>

                            <textarea data-dq-prompt="${gIdx}|${qIdx}" rows="2" placeholder="Énoncé de la question…"
                              class="w-full px-3 py-2 rounded-xl border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800/80 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">${escapeHtml(q.prompt)}</textarea>

                            ${isChoice ? `
                              <div class="space-y-1.5">
                                <div class="text-[11px] text-slate-400">Cliquez sur la lettre pour basculer : <strong class="text-emerald-600">Juste</strong> → <strong class="text-amber-600">(Toléré)</strong> → <strong>Non cochée</strong></div>
                                ${(q.items || []).map((it, iIdx) => {
                                  const isCor = q.correctAnswers.includes(it.letter);
                                  const isTol = q.toleratedAnswers.includes(it.letter);
                                  return `
                                    <div class="flex items-center gap-2">
                                      <button type="button" data-dq-cycle-ans="${gIdx}|${qIdx}|${it.letter}"
                                        class="px-2.5 py-1.5 rounded-lg border text-xs font-bold shrink-0 transition ${isCor ? 'bg-emerald-50 border-emerald-400 text-emerald-700 dark:bg-emerald-950/50 dark:border-emerald-700 dark:text-emerald-300' : isTol ? 'bg-amber-50 border-amber-400 text-amber-800 dark:bg-amber-950/50 dark:border-amber-700 dark:text-amber-300' : 'border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300'}">
                                        ${it.letter}${isCor ? ' ✓' : isTol ? ' (X)' : ''}
                                      </button>
                                      <input type="text" data-dq-item="${gIdx}|${qIdx}|${iIdx}" value="${escapeHtml(it.text)}"
                                        placeholder="Texte de la proposition ${it.letter}"
                                        class="flex-1 px-3 py-1.5 rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800/70 text-xs sm:text-sm" />
                                    </div>
                                  `;
                                }).join('')}
                              </div>
                            ` : `
                              <div>
                                <label class="block text-[11px] font-semibold text-slate-500 mb-1">Correction de référence personnelle (${q.type})</label>
                                <textarea data-dq-model="${gIdx}|${qIdx}" rows="2" placeholder="Saisissez votre correction personnelle…"
                                  class="w-full px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800/60 text-xs sm:text-sm">${escapeHtml(q.modelAnswer || '')}</textarea>
                              </div>
                            `}

                            <!-- Multi-images : Énoncé & Zone de correction -->
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-3 pt-1">
                              <div class="p-3 rounded-xl bg-slate-50 dark:bg-slate-800/50 border border-slate-200 dark:border-slate-700 space-y-2">
                                <div class="flex flex-wrap items-center justify-between gap-2">
                                  <span class="text-[11px] font-bold text-slate-600 dark:text-slate-300">Images énoncé (${q.imageIds.length})</span>
                                  <div class="flex items-center gap-2">
                                    ${(state.pdfDocCache || draft.pageImages.length > 0) ? `
                                      <button type="button" data-crop-stmt="${gIdx}|${qIdx}"
                                        class="px-2 py-1 rounded-lg text-[11px] font-bold bg-blue-600 hover:bg-blue-700 text-white">
                                        ✂ Rogner PDF
                                      </button>
                                    ` : ''}
                                    <label class="text-[11px] font-semibold text-blue-600 dark:text-blue-400 hover:underline cursor-pointer">
                                      + Fichier
                                      <input type="file" accept="image/*" data-dq-uploadimg="${gIdx}|${qIdx}" class="hidden" />
                                    </label>
                                  </div>
                                </div>
                                ${q.imageIds.length > 0 ? `
                                  <div class="flex flex-wrap gap-2">
                                    ${q.imageIds.map((imgId, imgIdx) => {
                                      const url = state.imageCache[imgId] || q._pendingImgs?.[imgId];
                                      return url ? `
                                        <div class="flex items-center gap-1.5 bg-white dark:bg-slate-900 p-1 rounded-lg border">
                                          <img src="${url}" data-zoom-src="${url}" class="h-11 w-auto rounded cursor-zoom-in" alt="" />
                                          <button type="button" data-rm-stmt-img="${gIdx}|${qIdx}|${imgIdx}" class="text-xs text-red-600 px-1">✕</button>
                                        </div>
                                      ` : '';
                                    }).join('')}
                                  </div>
                                ` : ''}
                              </div>

                              <div class="p-3 rounded-xl bg-emerald-50/40 dark:bg-emerald-950/20 border border-emerald-200 dark:border-emerald-800/70 space-y-2">
                                <div class="flex flex-wrap items-center justify-between gap-2">
                                  <span class="text-[11px] font-bold text-emerald-800 dark:text-emerald-300">Zones / Images correction (${q.correctionImageIds.length})</span>
                                  <div class="flex items-center gap-2">
                                    ${(state.pdfDocCache || draft.pageImages.length > 0) ? `
                                      <button type="button" data-crop-corr="${gIdx}|${qIdx}"
                                        class="px-2 py-1 rounded-lg text-[11px] font-bold bg-emerald-600 hover:bg-emerald-700 text-white">
                                        🎯 Zone corrigé PDF
                                      </button>
                                    ` : ''}
                                    <label class="text-[11px] font-semibold text-emerald-700 dark:text-emerald-300 hover:underline cursor-pointer">
                                      + Fichier
                                      <input type="file" accept="image/*" data-dq-uploadcorr="${gIdx}|${qIdx}" class="hidden" />
                                    </label>
                                  </div>
                                </div>
                                ${q.correctionImageIds.length > 0 ? `
                                  <div class="flex flex-wrap gap-2">
                                    ${q.correctionImageIds.map((imgId, imgIdx) => {
                                      const url = state.imageCache[imgId] || q._pendingImgs?.[imgId];
                                      return url ? `
                                        <div class="flex items-center gap-1.5 bg-white dark:bg-slate-900 p-1 rounded-lg border border-emerald-300">
                                          <img src="${url}" data-zoom-src="${url}" class="h-11 w-auto rounded cursor-zoom-in" alt="" />
                                          <button type="button" data-rm-corr-img="${gIdx}|${qIdx}|${imgIdx}" class="text-xs text-red-600 px-1">✕</button>
                                        </div>
                                      ` : '';
                                    }).join('')}
                                  </div>
                                ` : ''}
                              </div>
                            </div>
                          </div>
                        `;
                      }).join('')}
                    </div>
                  </section>
                `).join('')}

                <div class="flex flex-wrap items-center justify-between gap-3 pt-2">
                  <button type="button" id="btn-add-draft-group" class="px-4 py-2.5 rounded-xl text-xs font-bold bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-700 hover:border-blue-500">
                    + Ajouter un groupe
                  </button>
                  <button type="button" id="btn-save-import-bottom"
                    class="px-6 py-3 rounded-xl text-sm font-bold bg-emerald-600 hover:bg-emerald-700 text-white shadow-md transition">
                    ✓ Enregistrer ${isEditingExisting ? 'les modifications' : `tous les groupes (${draft.groups.length})`}
                  </button>
                </div>
              </div>
            ` : ''}
          </main>
        `;
      }

      function renderQuizView() {
        const quiz = state.quiz;
        if (!quiz) return '';

        const idx = quiz.currentIndex;
        const total = quiz.questions.length;
        const item = quiz.questions[idx];
        const q = item.question;
        const typeInfo = QUESTION_TYPES[q.type] || QUESTION_TYPES.QCM;
        const stmtImgUrls = (q.imageIds || []).map(id => state.imageCache[id]).filter(Boolean);
        const corrImgUrls = (q.correctionImageIds || []).map(id => state.imageCache[id]).filter(Boolean);
        const gradedCount = quiz.questions.filter(x => x.validated && x.score !== null).length;
        const pct = Math.round(((idx + 1) / total) * 100);

        const navPills = `
          <div class="flex items-center gap-1.5 overflow-x-auto pb-2 mb-4">
            ${quiz.questions.map((qi, i) => {
              let cls = 'bg-slate-200/80 dark:bg-slate-800 text-slate-600 dark:text-slate-400';
              if (qi.validated && qi.score !== null) {
                if (qi.score >= qi.maxScore) cls = 'bg-emerald-500 text-white';
                else if (qi.score > 0) cls = 'bg-amber-500 text-white';
                else cls = 'bg-red-500 text-white';
              } else if (qi.validated) {
                cls = 'bg-purple-500 text-white';
              }
              const ring = i === idx ? 'ring-2 ring-offset-2 ring-blue-600 dark:ring-offset-slate-950 scale-105' : '';
              return `
                <button type="button" data-quiz-jump="${i}"
                  class="w-8 h-8 rounded-lg text-xs font-bold shrink-0 transition ${cls} ${ring}">
                  ${i + 1}
                </button>
              `;
            }).join('')}
          </div>
        `;

        let answerZone = '';

        if (q.type === 'QCM' || q.type === 'QCU') {
          const isMulti = q.type === 'QCM';
          answerZone = `
            <div class="space-y-2.5 mt-5">
              ${item.displayItems.map(di => {
                const isSelected = item.selectedOrigLetters.includes(di.origLetter);
                const isCorrect = (q.correctAnswers || []).includes(di.origLetter);
                const isTolerated = (q.toleratedAnswers || []).includes(di.origLetter);

                let cardCls = 'border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 hover:border-blue-400 dark:hover:border-blue-500';
                let badgeHtml = '';

                if (!item.validated) {
                  if (isSelected) cardCls = 'border-blue-600 bg-blue-50/70 dark:bg-blue-950/40 ring-1 ring-blue-600';
                } else {
                  if (isCorrect && isSelected) {
                    cardCls = 'border-emerald-500 bg-emerald-50 dark:bg-emerald-950/40';
                    badgeHtml = '<span class="shrink-0 px-2 py-0.5 rounded-md text-[11px] font-bold bg-emerald-600 text-white">Juste</span>';
                  } else if (isCorrect && !isSelected) {
                    cardCls = 'border-amber-500 bg-amber-50 dark:bg-amber-950/40';
                    badgeHtml = '<span class="shrink-0 px-2 py-0.5 rounded-md text-[11px] font-bold bg-amber-500 text-white">Oublié (Vrai)</span>';
                  } else if (isTolerated) {
                    cardCls = 'border-amber-400 bg-amber-50/80 dark:bg-amber-950/30';
                    badgeHtml = `<span class="shrink-0 px-2 py-0.5 rounded-md text-[11px] font-bold bg-amber-500 text-white">${isSelected ? 'Toléré (coché)' : 'Toléré'}</span>`;
                  } else if (!isCorrect && isSelected) {
                    cardCls = 'border-red-500 bg-red-50 dark:bg-red-950/40';
                    badgeHtml = '<span class="shrink-0 px-2 py-0.5 rounded-md text-[11px] font-bold bg-red-600 text-white">Faux coché</span>';
                  } else {
                    cardCls = 'border-slate-200 dark:border-slate-800 bg-slate-50/50 dark:bg-slate-900/40 opacity-75';
                  }
                }

                return `
                  <button type="button" data-toggle-choice="${di.origLetter}" ${item.validated ? 'disabled' : ''}
                    class="w-full text-left p-3.5 sm:p-4 rounded-xl border-2 transition flex items-start gap-3 ${cardCls} ${item.validated ? 'cursor-default' : 'cursor-pointer'}">
                    <span class="w-7 h-7 ${isMulti ? 'rounded-lg' : 'rounded-full'} shrink-0 flex items-center justify-center text-xs font-extrabold ${isSelected ? 'bg-blue-600 text-white' : 'bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300'}">
                      ${di.displayLetter}
                    </span>
                    <span class="flex-1 text-sm sm:text-[15px] leading-relaxed text-slate-800 dark:text-slate-100 pt-0.5">${escapeHtml(di.text)}</span>
                    ${badgeHtml}
                  </button>
                `;
              }).join('')}
            </div>
          `;
        } else if (q.type === 'QROC') {
          answerZone = `
            <div class="mt-5 space-y-4">
              ${!item.validated ? `
                <div>
                  <label class="block text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1.5">Votre réponse courte</label>
                  <input type="text" id="quiz-open-input" value="${escapeHtml(item.textResponse)}"
                    placeholder="Tapez votre réponse ici…"
                    class="w-full px-4 py-3 rounded-xl border-2 border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-900 text-sm sm:text-base focus:border-blue-600 focus:outline-none" />
                </div>
              ` : `
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                  <div class="p-4 rounded-xl bg-slate-50 dark:bg-slate-800/70 border border-slate-200 dark:border-slate-700">
                    <div class="text-xs font-bold uppercase tracking-wider text-slate-500 mb-2">Votre réponse</div>
                    <div class="text-sm font-medium text-slate-900 dark:text-white">${item.textResponse.trim() ? formatRichText(item.textResponse) : '<span class="italic text-slate-400">Aucune réponse saisie</span>'}</div>
                  </div>
                  <div class="p-4 rounded-xl bg-teal-50/60 dark:bg-teal-950/30 border border-teal-200 dark:border-teal-800">
                    <div class="flex items-center justify-between mb-2">
                      <span class="text-xs font-bold uppercase tracking-wider text-teal-800 dark:text-teal-300">Correction de référence</span>
                      <button type="button" id="btn-toggle-edit-model" class="text-xs font-semibold text-teal-700 dark:text-teal-300 hover:underline">
                        ${item.editingModelAnswer ? 'Fermer' : (q.modelAnswer ? 'Modifier' : '+ Écrire')}
                      </button>
                    </div>
                    ${item.editingModelAnswer ? `
                      <textarea id="inline-model-textarea" rows="3" placeholder="Écrivez votre correction de référence…"
                        class="w-full px-3 py-2 rounded-lg border border-teal-300 dark:border-teal-700 bg-white dark:bg-slate-900 text-sm">${escapeHtml(q.modelAnswer || '')}</textarea>
                      <button type="button" id="btn-save-inline-model" class="mt-2 px-3.5 py-1.5 rounded-lg text-xs font-bold bg-teal-600 hover:bg-teal-700 text-white">
                        Sauvegarder
                      </button>
                    ` : `
                      <div class="text-sm text-slate-800 dark:text-slate-200">
                        ${q.modelAnswer ? formatRichText(q.modelAnswer) : '<span class="italic text-slate-400">Aucune correction enregistrée.</span>'}
                      </div>
                    `}
                  </div>
                </div>

                <div class="p-4 rounded-xl bg-slate-100/80 dark:bg-slate-800/70 border border-slate-200 dark:border-slate-700 flex flex-wrap items-center justify-between gap-3">
                  <div>
                    <div class="text-sm font-bold">Auto-évaluation QROC (0 ou 1 pt)</div>
                  </div>
                  <div class="flex items-center gap-2">
                    <button type="button" data-self-grade="0"
                      class="px-5 py-2.5 rounded-xl text-sm font-bold border-2 transition ${item.score === 0 ? 'bg-red-600 border-red-600 text-white shadow' : 'bg-white dark:bg-slate-900 border-slate-300 dark:border-slate-700 hover:border-red-500'}">
                      0 pt (Faux)
                    </button>
                    <button type="button" data-self-grade="1"
                      class="px-5 py-2.5 rounded-xl text-sm font-bold border-2 transition ${item.score === 1 ? 'bg-emerald-600 border-emerald-600 text-white shadow' : 'bg-white dark:bg-slate-900 border-slate-300 dark:border-slate-700 hover:border-emerald-500'}">
                      1 pt (Juste)
                    </button>
                  </div>
                </div>
              `}
            </div>
          `;
        } else {
          answerZone = `
            <div class="mt-5 space-y-4">
              ${!item.validated ? `
                <div>
                  <label class="block text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1.5">Votre réponse rédactionnelle (QROL — sur 7 points)</label>
                  <textarea id="quiz-open-input" rows="7" placeholder="Rédigez votre réponse complète ici…"
                    class="w-full px-4 py-3 rounded-xl border-2 border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-900 text-sm sm:text-base leading-relaxed focus:border-blue-600 focus:outline-none">${escapeHtml(item.textResponse)}</textarea>
                </div>
              ` : `
                <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
                  <div class="p-4 rounded-xl bg-slate-50 dark:bg-slate-800/70 border border-slate-200 dark:border-slate-700">
                    <div class="text-xs font-bold uppercase tracking-wider text-slate-500 mb-2">Ma réponse rédigée</div>
                    <div class="text-sm leading-relaxed text-slate-900 dark:text-white">
                      ${item.textResponse.trim() ? formatRichText(item.textResponse) : '<span class="italic text-slate-400">Aucune réponse rédigée</span>'}
                    </div>
                  </div>
                  <div class="p-4 rounded-xl bg-purple-50/60 dark:bg-purple-950/25 border border-purple-200 dark:border-purple-800">
                    <div class="flex items-center justify-between mb-2">
                      <span class="text-xs font-bold uppercase tracking-wider text-purple-700 dark:text-purple-300">Correction type personnelle</span>
                      <button type="button" id="btn-toggle-edit-model" class="text-xs font-semibold text-purple-700 dark:text-purple-300 hover:underline">
                        ${item.editingModelAnswer ? 'Fermer' : (q.modelAnswer ? 'Modifier' : '+ Écrire une correction type')}
                      </button>
                    </div>
                    ${item.editingModelAnswer ? `
                      <textarea id="inline-model-textarea" rows="6" placeholder="Rédigez votre correction type…"
                        class="w-full px-3 py-2 rounded-lg border border-purple-300 dark:border-purple-700 bg-white dark:bg-slate-900 text-sm leading-relaxed">${escapeHtml(q.modelAnswer || '')}</textarea>
                      <button type="button" id="btn-save-inline-model" class="mt-2 px-4 py-2 rounded-lg text-xs font-bold bg-purple-600 hover:bg-purple-700 text-white">
                        Sauvegarder la correction type
                      </button>
                    ` : `
                      <div class="text-sm leading-relaxed text-slate-800 dark:text-slate-200">
                        ${q.modelAnswer ? formatRichText(q.modelAnswer) : '<span class="italic text-slate-400">Aucune correction type enregistrée.</span>'}
                      </div>
                    `}
                  </div>
                </div>

                <div class="p-4 rounded-xl bg-slate-100/80 dark:bg-slate-800/70 border border-slate-200 dark:border-slate-700 space-y-3">
                  <div class="flex items-center justify-between">
                    <div class="text-sm font-bold">Auto-notation QROL (sur 7 points, pas de 0,5)</div>
                    ${item.score !== null ? `<span class="px-3 py-1 rounded-xl text-sm font-extrabold bg-purple-600 text-white">${formatNumber(item.score)} / 7</span>` : ''}
                  </div>
                  <div class="flex flex-wrap gap-1.5">
                    ${QROL_SCORES.map(val => `
                      <button type="button" data-self-grade="${val}"
                        class="px-3 py-2 rounded-xl text-xs font-bold border transition ${item.score === val ? 'bg-purple-600 border-purple-600 text-white shadow' : 'bg-white dark:bg-slate-900 border-slate-300 dark:border-slate-700 hover:border-purple-500'}">
                        ${formatNumber(val)}
                      </button>
                    `).join('')}
                  </div>
                </div>
              `}
            </div>
          `;
        }

        // Zones / images de correction affichées après validation
        const correctionMediaBlock = (item.validated && corrImgUrls.length > 0) ? `
          <div class="mt-5 p-4 rounded-2xl bg-emerald-50/70 dark:bg-emerald-950/25 border border-emerald-200 dark:border-emerald-800">
            <div class="text-xs font-extrabold uppercase tracking-wider text-emerald-800 dark:text-emerald-300 mb-2.5">
              🎯 Zone(s) de correction
            </div>
            <div class="flex flex-wrap gap-3">
              ${corrImgUrls.map((url, i) => `
                <img src="${url}" data-zoom-src="${url}" alt="Correction ${i + 1}"
                  class="max-h-64 w-auto rounded-xl border border-emerald-300 bg-white cursor-zoom-in shadow-sm" />
              `).join('')}
            </div>
          </div>
        ` : '';

        let feedbackBanner = '';
        if (item.validated && (q.type === 'QCM' || q.type === 'QCU')) {
          const isPerfect = item.score === item.maxScore;
          const isPartial = item.score > 0 && item.score < item.maxScore;
          const bannerCls = isPerfect
            ? 'bg-emerald-50 border-emerald-300 text-emerald-900 dark:bg-emerald-950/40 dark:border-emerald-800 dark:text-emerald-200'
            : isPartial
              ? 'bg-amber-50 border-amber-300 text-amber-900 dark:bg-amber-950/40 dark:border-amber-800 dark:text-amber-200'
              : 'bg-red-50 border-red-300 text-red-900 dark:bg-red-950/40 dark:border-red-800 dark:text-red-200';
          const corDisplay = item.displayItems
            .filter(d => (q.correctAnswers || []).includes(d.origLetter))
            .map(d => d.displayLetter)
            .join(', ') || 'Aucune';
          const tolDisplay = item.displayItems
            .filter(d => (q.toleratedAnswers || []).includes(d.origLetter))
            .map(d => `(${d.displayLetter})`)
            .join(', ');

          feedbackBanner = `
            <div class="mt-5 p-4 rounded-xl border ${bannerCls} flex flex-wrap items-center justify-between gap-3">
              <div>
                <div class="font-extrabold text-sm sm:text-base">
                  Score obtenu : ${formatNumber(item.score)} / ${formatNumber(item.maxScore)} pt
                  ${q.type === 'QCM' ? `<span class="font-medium text-xs ml-2">(${item.discordances} discordance${item.discordances > 1 ? 's' : ''})</span>` : ''}
                </div>
                <div class="text-xs mt-0.5">
                  Bonne(s) réponse(s) : <strong>${corDisplay}</strong>
                  ${tolDisplay ? ` • Toléré(s) : <strong>${tolDisplay}</strong>` : ''}
                </div>
              </div>
            </div>
          `;
        }

        const courseNotesBlock = item.validated ? `
          <div class="mt-5 p-4 sm:p-5 rounded-2xl bg-amber-50/60 dark:bg-amber-950/20 border border-amber-200 dark:border-amber-900/60">
            <div class="flex items-center justify-between gap-2 mb-2">
              <div class="text-xs font-extrabold uppercase tracking-wider text-amber-800 dark:text-amber-300">
                📚 Mes bouts de cours / Notes personnelles
              </div>
              <button type="button" id="btn-toggle-edit-notes" class="text-xs font-semibold text-amber-700 dark:text-amber-300 hover:underline">
                ${item.editingNotes ? 'Fermer' : (q.courseNotes ? 'Modifier' : '+ Ajouter un bout de cours')}
              </button>
            </div>
            ${item.editingNotes ? `
              <div class="space-y-2">
                <textarea id="inline-notes-textarea" rows="4" placeholder="Collez un extrait de cours, un moyen mnémotechnique…"
                  class="w-full px-3 py-2 rounded-xl border border-amber-300 dark:border-amber-800 bg-white dark:bg-slate-900 text-sm">${escapeHtml(q.courseNotes || '')}</textarea>
                <div class="flex justify-end">
                  <button type="button" id="btn-save-inline-notes" class="px-4 py-1.5 rounded-xl text-xs font-bold bg-amber-600 hover:bg-amber-700 text-white">
                    Sauvegarder sur cette question
                  </button>
                </div>
              </div>
            ` : `
              <div class="text-sm leading-relaxed text-slate-800 dark:text-slate-200">
                ${q.courseNotes ? formatRichText(q.courseNotes) : '<span class="italic text-slate-500 dark:text-slate-400">Aucune note enregistrée.</span>'}
              </div>
            `}
          </div>
        ` : '';

        return `
          <main class="flex-1 max-w-4xl w-full mx-auto p-4 sm:p-6">
            <div class="flex flex-wrap items-center justify-between gap-3 mb-4">
              <div>
                <div class="text-xs font-semibold text-slate-500 dark:text-slate-400">
                  ${item.subFolderName ? `<span class="text-blue-600 dark:text-blue-400 font-bold">${escapeHtml(item.subFolderName)}</span> · ` : ''}${escapeHtml(item.groupTitle)}
                </div>
                <div class="text-sm font-extrabold text-[#1E3A5F] dark:text-blue-400">
                  Question ${idx + 1} / ${total} <span class="font-medium text-slate-400 ml-1">(${gradedCount} notée${gradedCount > 1 ? 's' : ''})</span>
                </div>
              </div>
              <div class="flex items-center gap-2">
                <button type="button" id="btn-quit-quiz" class="px-3 py-1.5 rounded-xl text-xs font-semibold text-slate-600 dark:text-slate-300 hover:bg-slate-200/70 dark:hover:bg-slate-800">
                  Quitter
                </button>
                <button type="button" id="btn-finish-quiz-top" class="px-3.5 py-1.5 rounded-xl text-xs font-bold bg-[#1E3A5F] hover:bg-[#152A45] text-white">
                  Terminer la copie
                </button>
              </div>
            </div>

            <div class="w-full h-2 rounded-full bg-slate-200 dark:bg-slate-800 overflow-hidden mb-4">
              <div class="h-full bg-blue-600 transition-all duration-300" style="width:${pct}%"></div>
            </div>

            ${navPills}

            <article class="rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 shadow-sm p-5 sm:p-7">
              <div class="flex flex-wrap items-center justify-between gap-2 mb-4">
                <div class="flex flex-wrap items-center gap-2">
                  <span class="px-2.5 py-1 rounded-lg text-xs font-extrabold ${typeInfo.badge}">${q.type}</span>
                  <span class="text-xs font-semibold text-slate-400">N° sujet : Q${q.origNumber}</span>
                  ${q.subtitle ? `<span class="text-xs font-semibold text-slate-600 dark:text-slate-300">• ${escapeHtml(q.subtitle)}</span>` : ''}
                </div>
                <button type="button" id="btn-quick-edit-q" class="text-xs font-semibold text-slate-500 hover:text-blue-600 dark:hover:text-blue-400 px-2.5 py-1 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 transition">
                  ✎ Éditer la question
                </button>
              </div>

              <div class="text-base sm:text-lg font-bold text-slate-900 dark:text-white leading-relaxed">
                ${formatRichText(q.prompt)}
              </div>

              ${stmtImgUrls.length > 0 ? `
                <div class="mt-4 flex flex-wrap gap-3">
                  ${stmtImgUrls.map((url, i) => `
                    <div class="relative cursor-zoom-in rounded-xl overflow-hidden border border-slate-200 dark:border-slate-700 bg-white" data-zoom-src="${url}">
                      <img src="${url}" alt="Figure ${i + 1}" class="max-h-80 w-auto object-contain" />
                      <div class="absolute bottom-2 right-2 px-2.5 py-1 rounded-lg bg-slate-900/75 text-white text-[11px] font-semibold">
                        🔍 Zoom
                      </div>
                    </div>
                  `).join('')}
                </div>
              ` : ''}

              ${answerZone}
              ${feedbackBanner}
              ${correctionMediaBlock}
              ${courseNotesBlock}

              <div class="mt-7 pt-5 border-t border-slate-100 dark:border-slate-800 flex flex-wrap items-center justify-between gap-3">
                <button type="button" id="btn-prev-q" ${idx === 0 ? 'disabled' : ''}
                  class="px-4 py-2.5 rounded-xl text-sm font-semibold border border-slate-300 dark:border-slate-700 disabled:opacity-40 hover:bg-slate-100 dark:hover:bg-slate-800 transition">
                  ← Précédente
                </button>
                <div class="flex items-center gap-2.5">
                  ${!item.validated ? `
                    <button type="button" id="btn-validate-q"
                      class="px-6 py-2.5 rounded-xl text-sm font-bold bg-blue-600 hover:bg-blue-700 text-white shadow-sm transition">
                      ${q.type === 'QCM' || q.type === 'QCU' ? 'Valider ma réponse' : 'Valider et comparer'}
                    </button>
                  ` : idx < total - 1 ? `
                    <button type="button" id="btn-next-q"
                      class="px-6 py-2.5 rounded-xl text-sm font-bold bg-[#1E3A5F] hover:bg-[#152A45] text-white shadow-sm transition">
                      Question suivante →
                    </button>
                  ` : `
                    <button type="button" id="btn-finish-quiz-bottom"
                      class="px-6 py-2.5 rounded-xl text-sm font-bold bg-emerald-600 hover:bg-emerald-700 text-white shadow-sm transition">
                      ✓ Terminer et voir mon bilan
                    </button>
                  `}
                </div>
              </div>
            </article>
          </main>
        `;
      }

      function renderResultsOrReviewView(attempt, isFromHistory = false) {
        if (!attempt) return '';
        const errorCount = (attempt.details || []).filter(d => d.score < d.maxScore).length;
        const tb = attempt.typeBreakdown || {};

        return `
          <main class="flex-1 max-w-5xl w-full mx-auto p-4 sm:p-6 lg:p-8 space-y-6">
            <div class="flex flex-wrap items-center justify-between gap-3">
              <div>
                <button type="button" id="btn-results-back" class="text-xs font-semibold text-blue-600 dark:text-blue-400 hover:underline mb-1">
                  ← ${isFromHistory ? 'Retour à l\'historique' : 'Retour à la session'}
                </button>
                <h1 class="text-xl sm:text-2xl font-extrabold">${isFromHistory ? 'Relecture de votre copie' : 'Bilan de votre entraînement'}</h1>
                <p class="text-xs sm:text-sm text-slate-500 dark:text-slate-400 mt-0.5">
                  ${escapeHtml(getPathLabel(attempt))} • ${(attempt.groupTitles || []).map(escapeHtml).join(' + ')} • ${formatDate(attempt.createdAt)}
                </p>
              </div>
              ${errorCount > 0 ? `
                <button type="button" id="btn-retry-errors"
                  class="px-4 py-2.5 rounded-xl text-sm font-bold bg-amber-500 hover:bg-amber-600 text-white shadow-sm transition">
                  ↻ Refaire uniquement mes erreurs (${errorCount})
                </button>
              ` : ''}
            </div>

            <section class="rounded-2xl bg-[#1E3A5F] text-white p-6 shadow-lg grid grid-cols-1 md:grid-cols-3 gap-6 items-center">
              <div>
                <div class="text-xs uppercase tracking-wider text-blue-200 font-bold">Note globale</div>
                <div class="text-4xl font-extrabold mt-1">${formatNumber(attempt.scoreOn20, 2)} <span class="text-lg text-blue-200">/ 20</span></div>
                <div class="text-sm text-blue-100 mt-1">
                  Score brut : <strong>${formatNumber(attempt.totalScore)} / ${formatNumber(attempt.maxScore)} pts</strong>
                </div>
              </div>
              <div class="md:col-span-2 grid grid-cols-2 sm:grid-cols-4 gap-3">
                ${['QCM', 'QCU', 'QROC', 'QROL'].map(t => {
                  const s = tb[t] || { count: 0, score: 0, max: 0 };
                  return `
                    <div class="p-3 rounded-xl bg-white/10 border border-white/10">
                      <div class="text-xs font-bold text-blue-200">${t} (${s.count})</div>
                      <div class="text-lg font-extrabold mt-1">${s.count > 0 ? `${formatNumber(s.score)} / ${formatNumber(s.max)}` : '—'}</div>
                    </div>
                  `;
                }).join('')}
              </div>
            </section>

            <section class="space-y-4">
              <h2 class="text-lg font-extrabold">Correction détaillée (${(attempt.details || []).length} questions)</h2>
              ${(attempt.details || []).map((d, i) => {
                const isPerfect = d.score >= d.maxScore;
                const isPartial = d.score > 0 && d.score < d.maxScore;
                const badgeCls = isPerfect
                  ? 'bg-emerald-100 text-emerald-800 dark:bg-emerald-900/50 dark:text-emerald-300'
                  : isPartial
                    ? 'bg-amber-100 text-amber-800 dark:bg-amber-900/50 dark:text-amber-300'
                    : 'bg-red-100 text-red-800 dark:bg-red-900/50 dark:text-red-300';

                const liveGrp = state.groups.find(g => g.id === d.groupId);
                const liveQ = liveGrp?.questions?.find(q => q.id === d.questionId);
                const notes = liveQ ? liveQ.courseNotes : d.courseNotes;
                const model = liveQ ? liveQ.modelAnswer : d.modelAnswer;
                const corrImgs = ((liveQ?.correctionImageIds || d.correctionImageIds) || []).map(id => state.imageCache[id]).filter(Boolean);
                const itemsShow = (d.displayItems && d.displayItems.length > 0)
                  ? d.displayItems
                  : (d.items || []).map(x => ({ displayLetter: x.letter, origLetter: x.letter, text: x.text }));

                return `
                  <article class="rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-5 space-y-3">
                    <div class="flex flex-wrap items-center justify-between gap-2">
                      <div class="flex flex-wrap items-center gap-2">
                        <span class="font-extrabold text-sm text-slate-400">#${i + 1}</span>
                        <span class="px-2 py-0.5 rounded-md text-xs font-bold ${QUESTION_TYPES[d.type]?.badge || ''}">${d.type}</span>
                        <span class="text-xs text-slate-500">
                          Q${d.origNumber}${d.subFolderName ? ` • ${escapeHtml(d.subFolderName)}` : ''} • ${escapeHtml(d.groupTitle || '')}
                        </span>
                      </div>
                      <span class="px-3 py-1 rounded-xl text-xs font-extrabold ${badgeCls}">
                        ${formatNumber(d.score)} / ${formatNumber(d.maxScore)} pt${d.maxScore > 1 ? 's' : ''}
                      </span>
                    </div>

                    <div class="font-bold text-sm sm:text-base text-slate-900 dark:text-white">${formatRichText(d.prompt)}</div>

                    ${d.type === 'QCM' || d.type === 'QCU' ? `
                      <div class="space-y-1.5 pt-1">
                        ${itemsShow.map(it => {
                          const sel = (d.selectedOrigLetters || []).includes(it.origLetter);
                          const cor = (d.correctAnswers || []).includes(it.origLetter);
                          const tol = (d.toleratedAnswers || []).includes(it.origLetter);
                          let rowCls = 'text-slate-600 dark:text-slate-400';
                          let tag = '';
                          if (cor && sel) { rowCls = 'bg-emerald-50 dark:bg-emerald-950/30 text-emerald-900 dark:text-emerald-200 font-semibold'; tag = '✓ Juste'; }
                          else if (cor && !sel) { rowCls = 'bg-amber-50 dark:bg-amber-950/30 text-amber-900 dark:text-amber-200 font-semibold'; tag = '! Oublié (Vrai)'; }
                          else if (tol) { rowCls = 'bg-amber-50/70 dark:bg-amber-950/20 text-amber-900 dark:text-amber-200 font-semibold'; tag = '(Toléré)'; }
                          else if (!cor && sel) { rowCls = 'bg-red-50 dark:bg-red-950/30 text-red-900 dark:text-red-200 font-semibold'; tag = '✕ Faux coché'; }
                          return `
                            <div class="px-3 py-1.5 rounded-lg text-xs sm:text-sm flex items-start justify-between gap-2 ${rowCls}">
                              <span><strong>${it.displayLetter}.</strong> ${escapeHtml(it.text)}</span>
                              ${tag ? `<span class="shrink-0 text-[11px] font-bold">${tag}</span>` : ''}
                            </div>
                          `;
                        }).join('')}
                      </div>
                    ` : `
                      <div class="grid grid-cols-1 md:grid-cols-2 gap-3 pt-1">
                        <div class="p-3 rounded-xl bg-slate-50 dark:bg-slate-800/70 text-xs sm:text-sm">
                          <div class="font-bold text-slate-500 mb-1">Votre réponse :</div>
                          <div>${d.textResponse ? formatRichText(d.textResponse) : '<span class="italic text-slate-400">Aucune</span>'}</div>
                        </div>
                        <div class="p-3 rounded-xl bg-blue-50/50 dark:bg-blue-950/30 text-xs sm:text-sm">
                          <div class="font-bold text-blue-700 dark:text-blue-300 mb-1">Ma correction personnelle :</div>
                          <div>${model ? formatRichText(model) : '<span class="italic text-slate-400">Non renseignée</span>'}</div>
                        </div>
                      </div>
                    `}

                    ${corrImgs.length > 0 ? `
                      <div class="flex flex-wrap gap-2 pt-1">
                        ${corrImgs.map(url => `<img src="${url}" data-zoom-src="${url}" class="h-24 w-auto rounded-lg border border-emerald-300 cursor-zoom-in" alt="" />`).join('')}
                      </div>
                    ` : ''}

                    ${notes ? `
                      <div class="p-3 rounded-xl bg-amber-50/70 dark:bg-amber-950/20 border border-amber-200/80 dark:border-amber-900/50 text-xs sm:text-sm">
                        <div class="font-bold text-amber-800 dark:text-amber-300 mb-1">📚 Mes bouts de cours :</div>
                        <div>${formatRichText(notes)}</div>
                      </div>
                    ` : ''}
                  </article>
                `;
              }).join('')}
            </section>
          </main>
        `;
      }

      function renderHistoryView() {
        const fSem = state.historyFilter.semesterId;
        const fUe = state.historyFilter.ueId;

        const filtered = state.attempts.filter(a => {
          if (fSem !== 'all' && a.semesterId !== fSem) return false;
          if (fUe !== 'all' && a.ueId !== fUe) return false;
          return true;
        });

        const avg20 = filtered.length > 0
          ? filtered.reduce((acc, a) => acc + (a.scoreOn20 || 0), 0) / filtered.length
          : 0;
        const totalQDone = filtered.reduce((acc, a) => acc + (a.details?.length || 0), 0);

        const ueOptions = [];
        CURRICULUM.forEach(s => {
          if (fSem === 'all' || s.id === fSem) {
            s.ues.forEach(u => ueOptions.push({ id: u.id, label: `${s.shortName} · ${u.code} ${u.name}` }));
          }
        });

        return `
          <main class="flex-1 max-w-6xl w-full mx-auto p-4 sm:p-6 lg:p-8 space-y-6">
            <div class="flex flex-wrap items-center justify-between gap-4">
              <div>
                <h1 class="text-xl sm:text-2xl font-extrabold">Historique des réalisations</h1>
                <p class="text-sm text-slate-500 dark:text-slate-400 mt-0.5">Consultez vos anciennes copies corrigées et relancez vos erreurs</p>
              </div>
              <div class="flex flex-wrap gap-2">
                <select id="hist-filter-sem" class="px-3 py-2 rounded-xl text-xs sm:text-sm border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-900">
                  <option value="all" ${fSem === 'all' ? 'selected' : ''}>Tous les semestres</option>
                  ${CURRICULUM.map(s => `<option value="${s.id}" ${fSem === s.id ? 'selected' : ''}>${escapeHtml(s.name)}</option>`).join('')}
                </select>
                <select id="hist-filter-ue" class="px-3 py-2 rounded-xl text-xs sm:text-sm border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-900">
                  <option value="all" ${fUe === 'all' ? 'selected' : ''}>Toutes les UE</option>
                  ${ueOptions.map(u => `<option value="${u.id}" ${fUe === u.id ? 'selected' : ''}>${escapeHtml(u.label)}</option>`).join('')}
                </select>
              </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
              <div class="p-5 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 shadow-sm">
                <div class="text-xs font-bold uppercase tracking-wider text-slate-500">Séries réalisées</div>
                <div class="text-3xl font-extrabold text-[#1E3A5F] dark:text-blue-400 mt-1">${filtered.length}</div>
              </div>
              <div class="p-5 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 shadow-sm">
                <div class="text-xs font-bold uppercase tracking-wider text-slate-500">Moyenne générale</div>
                <div class="text-3xl font-extrabold mt-1 ${avg20 >= 14 ? 'text-emerald-600' : avg20 >= 10 ? 'text-amber-500' : 'text-slate-700 dark:text-slate-200'}">
                  ${filtered.length > 0 ? `${formatNumber(avg20, 2)} / 20` : '—'}
                </div>
              </div>
              <div class="p-5 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 shadow-sm">
                <div class="text-xs font-bold uppercase tracking-wider text-slate-500">Questions traitées</div>
                <div class="text-3xl font-extrabold text-[#1E3A5F] dark:text-blue-400 mt-1">${totalQDone}</div>
              </div>
            </div>

            ${filtered.length === 0 ? `
              <div class="rounded-2xl border-2 border-dashed border-slate-300 dark:border-slate-700 p-10 text-center text-slate-500">
                Aucune réalisation pour ces filtres.
              </div>
            ` : `
              <div class="space-y-3">
                ${filtered.map(a => {
                  const errCnt = (a.details || []).filter(d => d.score < d.maxScore).length;
                  const scoreColor = a.scoreOn20 >= 14
                    ? 'bg-emerald-100 text-emerald-800 dark:bg-emerald-900/50 dark:text-emerald-300'
                    : a.scoreOn20 >= 10
                      ? 'bg-amber-100 text-amber-800 dark:bg-amber-900/50 dark:text-amber-300'
                      : 'bg-red-100 text-red-800 dark:bg-red-900/50 dark:text-red-300';
                  return `
                    <div class="p-4 sm:p-5 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 shadow-sm flex flex-col lg:flex-row lg:items-center justify-between gap-4">
                      <div class="space-y-1">
                        <div class="flex flex-wrap items-center gap-2">
                          <span class="px-2.5 py-0.5 rounded-lg text-xs font-extrabold ${scoreColor}">
                            ${formatNumber(a.scoreOn20, 1)} / 20
                          </span>
                          <span class="text-xs font-bold text-slate-700 dark:text-slate-200">
                            ${formatNumber(a.totalScore)} / ${formatNumber(a.maxScore)} pts
                          </span>
                          <span class="text-xs text-slate-400">• ${formatDate(a.createdAt)}</span>
                        </div>
                        <div class="font-bold text-sm sm:text-base text-slate-900 dark:text-white">
                          ${(a.groupTitles || ['Entraînement']).map(escapeHtml).join(' + ')}
                        </div>
                        <div class="text-xs text-slate-500 dark:text-slate-400">
                          ${escapeHtml(getPathLabel(a))} • ${(a.details || []).length} question(s)
                        </div>
                      </div>
                      <div class="flex flex-wrap items-center gap-2">
                        <button type="button" data-review-attempt="${a.id}"
                          class="px-3.5 py-2 rounded-xl text-xs font-bold bg-[#1E3A5F] hover:bg-[#152A45] text-white transition">
                          Revoir ma copie
                        </button>
                        ${errCnt > 0 ? `
                          <button type="button" data-retry-attempt="${a.id}"
                            class="px-3.5 py-2 rounded-xl text-xs font-bold bg-amber-500 hover:bg-amber-600 text-white transition">
                            ↻ Refaire mes erreurs (${errCnt})
                          </button>
                        ` : ''}
                        <button type="button" data-del-attempt="${a.id}"
                          class="p-2 rounded-xl text-xs text-red-600 hover:bg-red-50 dark:hover:bg-red-950/40" title="Supprimer">
                          🗑
                        </button>
                      </div>
                    </div>
                  `;
                }).join('')}
              </div>
            `}
          </main>
        `;
      }

      /* =========================================================================
         13. RENDU GLOBAL & GESTIONNAIRES D'ÉVÉNEMENTS
         ========================================================================= */

      function render() {
        const appEl = document.getElementById('app');
        if (!appEl) return;

        let main = '';
        if (state.view === 'explorer') main = renderExplorerView();
        else if (state.view === 'import' || state.view === 'editGroup') main = renderImportOrEditView();
        else if (state.view === 'quiz') main = renderQuizView();
        else if (state.view === 'results') main = renderResultsOrReviewView(state.lastAttempt, false);
        else if (state.view === 'reviewAttempt') main = renderResultsOrReviewView(state.reviewAttempt, true);
        else if (state.view === 'history') main = renderHistoryView();

        appEl.innerHTML = `${renderTopBar()}${main}`;
        bindEvents();
      }

      function bindEvents() {
        const btnHome = document.getElementById('btn-go-home');
        if (btnHome) btnHome.onclick = () => {
          state.view = 'explorer';
          state.nav = { semesterId: 's1', ueId: null, year: null, session: null, subFolderId: null };
          render();
        };

        const btnToggleSb = document.getElementById('btn-toggle-sidebar');
        if (btnToggleSb) btnToggleSb.onclick = () => { state.mobileSidebarOpen = !state.mobileSidebarOpen; render(); };
        const btnCloseSb = document.getElementById('btn-close-sidebar');
        if (btnCloseSb) btnCloseSb.onclick = () => { state.mobileSidebarOpen = false; render(); };
        const sbBackdrop = document.getElementById('sidebar-backdrop');
        if (sbBackdrop) sbBackdrop.onclick = () => { state.mobileSidebarOpen = false; render(); };

        document.querySelectorAll('[data-top-nav]').forEach(btn => {
          btn.onclick = () => {
            state.view = btn.dataset.topNav;
            state.mobileSidebarOpen = false;
            render();
          };
        });

        const btnDark = document.getElementById('btn-dark-toggle');
        if (btnDark) btnDark.onclick = () => {
          state.darkMode = !state.darkMode;
          applyTheme();
          savePreferences();
          render();
        };

        const btnSettings = document.getElementById('btn-open-settings');
        if (btnSettings) btnSettings.onclick = () => openSettingsModal();

        const btnDemoTop = document.getElementById('btn-load-demo-top');
        if (btnDemoTop) btnDemoTop.onclick = () => loadDemoSubject();

        // Explorer navigation
        document.querySelectorAll('[data-select-sem]').forEach(btn => {
          btn.onclick = () => {
            state.nav = { semesterId: btn.dataset.selectSem, ueId: null, year: null, session: null, subFolderId: null };
            state.view = 'explorer';
            state.mobileSidebarOpen = false;
            render();
          };
        });

        document.querySelectorAll('[data-select-ue]').forEach(btn => {
          btn.onclick = () => {
            const [semId, ueId] = btn.dataset.selectUe.split('|');
            state.nav = { semesterId: semId, ueId, year: null, session: null, subFolderId: null };
            state.view = 'explorer';
            state.mobileSidebarOpen = false;
            render();
          };
        });

        document.querySelectorAll('[data-select-year]').forEach(btn => {
          btn.onclick = () => {
            state.nav.year = btn.dataset.selectYear;
            state.nav.session = null;
            state.nav.subFolderId = null;
            state.mobileSidebarOpen = false;
            render();
          };
        });

        document.querySelectorAll('[data-select-session]').forEach(btn => {
          btn.onclick = () => {
            state.nav.session = Number(btn.dataset.selectSession);
            state.nav.subFolderId = null;
            render();
          };
        });

        document.querySelectorAll('[data-filter-sf]').forEach(btn => {
          btn.onclick = () => {
            state.nav.subFolderId = btn.dataset.filterSf || null;
            render();
          };
        });

        document.querySelectorAll('[data-crumb]').forEach(btn => {
          btn.onclick = () => {
            const act = btn.dataset.crumb;
            if (act === 'crumb-root') {
              state.nav = { semesterId: state.nav.semesterId || 's1', ueId: null, year: null, session: null, subFolderId: null };
            } else if (act.startsWith('crumb-sem:')) {
              state.nav = { semesterId: act.slice(10), ueId: null, year: null, session: null, subFolderId: null };
            } else if (act.startsWith('crumb-ue:')) {
              const [semId, ueId] = act.slice(9).split('|');
              state.nav = { semesterId: semId, ueId, year: null, session: null, subFolderId: null };
            } else if (act.startsWith('crumb-year:')) {
              state.nav.year = act.slice(11);
              state.nav.session = null;
              state.nav.subFolderId = null;
            } else if (act.startsWith('crumb-session:')) {
              state.nav.session = Number(act.slice(14));
              state.nav.subFolderId = null;
            }
            render();
          };
        });

        const btnAddYear = document.getElementById('btn-add-year');
        if (btnAddYear) btnAddYear.onclick = () => openAddYearModal();

        // Session actions
        const openImport = (manualOnly = false) => {
          const ue = getUE(state.nav.semesterId, state.nav.ueId);
          const defaultSf = state.nav.subFolderId || (ue && ue.subFolders.length > 0 ? ue.subFolders[0].id : null);
          state.undoStack = [];
          state.redoStack = [];
          state.importDraft = {
            targetPath: { ...state.nav },
            pdfName: '',
            pageImages: [],
            groups: manualOnly ? [{
              id: uid('grp'),
              semesterId: state.nav.semesterId,
              ueId: state.nav.ueId,
              subFolderId: defaultSf,
              title: 'Nouveau groupe de questions',
              questions: [createEmptyQuestion('QCM', 1)]
            }] : [],
            isParsing: false,
            parseProgress: 0,
            parseStatus: '',
            editingGroupId: null
          };
          state.view = 'import';
          render();
        };

        const btnPdf = document.getElementById('btn-open-pdf-import');
        if (btnPdf) btnPdf.onclick = () => openImport(false);
        const btnEmptyImp = document.getElementById('btn-empty-import');
        if (btnEmptyImp) btnEmptyImp.onclick = () => openImport(false);
        const btnMan = document.getElementById('btn-manual-create');
        if (btnMan) btnMan.onclick = () => openImport(true);
        const btnEmptyMan = document.getElementById('btn-empty-manual');
        if (btnEmptyMan) btnEmptyMan.onclick = () => openImport(true);

        const btnLaunchAll = document.getElementById('btn-launch-all-session');
        if (btnLaunchAll) btnLaunchAll.onclick = () => {
          const allG = getGroupsForSession(state.nav.semesterId, state.nav.ueId, state.nav.year, state.nav.session);
          openQuizConfigModal(allG, `Session ${state.nav.session} complète (${state.nav.year})`);
        };

        document.querySelectorAll('[data-launch-subfolder]').forEach(btn => {
          btn.onclick = () => {
            const sfId = btn.dataset.launchSubfolder;
            const sf = getSubFolder(state.nav.semesterId, state.nav.ueId, sfId);
            const sfGroups = getGroupsForSession(state.nav.semesterId, state.nav.ueId, state.nav.year, state.nav.session, sfId);
            openQuizConfigModal(sfGroups, `${sf ? sf.name : 'Sous-matière'} (${state.nav.year} S${state.nav.session})`);
          };
        });

        document.querySelectorAll('[data-launch-group]').forEach(btn => {
          btn.onclick = () => {
            const g = state.groups.find(x => x.id === btn.dataset.launchGroup);
            if (g) openQuizConfigModal([g], g.title);
          };
        });

        document.querySelectorAll('[data-edit-group]').forEach(btn => {
          btn.onclick = () => {
            const g = state.groups.find(x => x.id === btn.dataset.editGroup);
            if (!g) return;
            state.undoStack = [];
            state.redoStack = [];
            state.importDraft = {
              targetPath: {
                semesterId: g.semesterId,
                ueId: g.ueId,
                year: g.year,
                session: g.session,
                subFolderId: g.subFolderId || null
              },
              pdfName: '',
              pageImages: [],
              groups: [JSON.parse(JSON.stringify(g))],
              isParsing: false,
              parseProgress: 100,
              parseStatus: '',
              editingGroupId: g.id
            };
            state.view = 'editGroup';
            render();
          };
        });

        document.querySelectorAll('[data-delete-group]').forEach(btn => {
          btn.onclick = () => {
            const g = state.groups.find(x => x.id === btn.dataset.deleteGroup);
            if (!g) return;
            openConfirmModal(
              'Supprimer ce groupe ?',
              `Le groupe « ${g.title} » (${(g.questions || []).length} questions) sera supprimé.`,
              'Supprimer',
              () => deleteGroup(g.id),
              true
            );
          };
        });

        // Import / Éditeur
        if (state.view === 'import' || state.view === 'editGroup') {
          const draft = state.importDraft;

          const btnUndo = document.getElementById('btn-undo-action');
          if (btnUndo) btnUndo.onclick = () => performUndo();

          const btnCancel = document.getElementById('btn-cancel-import');
          if (btnCancel) btnCancel.onclick = () => {
            state.importDraft = null;
            state.undoStack = [];
            state.redoStack = [];
            state.view = 'explorer';
            render();
          };

          const fileInp = document.getElementById('pdf-file-input');
          const triggerBtn = document.getElementById('btn-trigger-pdf-input');
          const dropZone = document.getElementById('pdf-drop-zone');
          if (triggerBtn && fileInp) triggerBtn.onclick = () => fileInp.click();
          if (fileInp) fileInp.onchange = (e) => { if (e.target.files[0]) handlePdfFileUpload(e.target.files[0]); };
          if (dropZone) {
            dropZone.ondragover = (e) => {
              e.preventDefault();
              dropZone.classList.add('border-blue-600', 'bg-blue-100/60', 'dark:bg-blue-900/30');
            };
            dropZone.ondragleave = () => {
              dropZone.classList.remove('border-blue-600', 'bg-blue-100/60', 'dark:bg-blue-900/30');
            };
            dropZone.ondrop = (e) => {
              e.preventDefault();
              dropZone.classList.remove('border-blue-600', 'bg-blue-100/60', 'dark:bg-blue-900/30');
              if (e.dataTransfer.files[0]) handlePdfFileUpload(e.dataTransfer.files[0]);
            };
          }

          document.querySelectorAll('[data-draft-grp-title]').forEach(inp => {
            inp.onchange = () => {
              pushUndoSnapshot('Renommage de groupe');
              draft.groups[Number(inp.dataset.draftGrpTitle)].title = inp.value;
            };
            inp.oninput = () => {
              draft.groups[Number(inp.dataset.draftGrpTitle)].title = inp.value;
            };
          });

          // Routage par groupe : Période + UE + Sous-matière
          document.querySelectorAll('[data-grp-dest-sem]').forEach(sel => {
            sel.onchange = () => {
              pushUndoSnapshot('Changement de période du groupe');
              const gIdx = Number(sel.dataset.grpDestSem);
              const grp = draft.groups[gIdx];
              const newSem = getSemester(sel.value) || CURRICULUM[0];
              const newUe = newSem.ues[0];
              grp.semesterId = newSem.id;
              grp.ueId = newUe ? newUe.id : null;
              grp.subFolderId = newUe && newUe.subFolders.length > 0 ? newUe.subFolders[0].id : null;
              render();
            };
          });

          document.querySelectorAll('[data-grp-dest-ue]').forEach(sel => {
            sel.onchange = () => {
              pushUndoSnapshot('Changement d\'UE du groupe');
              const gIdx = Number(sel.dataset.grpDestUe);
              const grp = draft.groups[gIdx];
              const newUe = getUE(grp.semesterId, sel.value);
              grp.ueId = newUe ? newUe.id : sel.value;
              grp.subFolderId = newUe && newUe.subFolders.length > 0 ? newUe.subFolders[0].id : null;
              render();
            };
          });

          document.querySelectorAll('[data-grp-dest-sf]').forEach(sel => {
            sel.onchange = () => {
              pushUndoSnapshot('Changement de sous-matière');
              const gIdx = Number(sel.dataset.grpDestSf);
              draft.groups[gIdx].subFolderId = sel.value || null;
              render();
            };
          });

          document.querySelectorAll('[data-merge-grp]').forEach(btn => {
            btn.onclick = () => {
              const gIdx = Number(btn.dataset.mergeGrp);
              if (gIdx <= 0) return;
              pushUndoSnapshot('Fusion de groupes');
              draft.groups[gIdx - 1].questions.push(...draft.groups[gIdx].questions);
              draft.groups.splice(gIdx, 1);
              render();
            };
          });

          document.querySelectorAll('[data-split-grp]').forEach(btn => {
            btn.onclick = () => {
              const [gIdx, qIdx] = btn.dataset.splitGrp.split('|').map(Number);
              pushUndoSnapshot('Scission de groupe');
              const grp = draft.groups[gIdx];
              const moved = grp.questions.splice(qIdx);
              draft.groups.splice(gIdx + 1, 0, {
                id: uid('grp'),
                semesterId: grp.semesterId,
                ueId: grp.ueId,
                subFolderId: grp.subFolderId,
                title: `Nouveau groupe (${moved.length} Q)`,
                questions: moved
              });
              showToast('Groupe scindé.', 'info');
              render();
            };
          });

          document.querySelectorAll('[data-move-q]').forEach(sel => {
            sel.onchange = () => {
              if (sel.value === '') return;
              const [fromG, qIdx] = sel.dataset.moveQ.split('|').map(Number);
              const toG = Number(sel.value);
              if (fromG === toG) return;
              pushUndoSnapshot('Déplacement de question');
              const [movedQ] = draft.groups[fromG].questions.splice(qIdx, 1);
              draft.groups[toG].questions.push(movedQ);
              showToast(`Question Q${movedQ.origNumber} déplacée vers le groupe ${toG + 1}.`, 'info');
              render();
            };
          });

          document.querySelectorAll('[data-del-grp]').forEach(btn => {
            btn.onclick = () => {
              pushUndoSnapshot('Suppression de groupe');
              draft.groups.splice(Number(btn.dataset.delGrp), 1);
              render();
            };
          });

          document.querySelectorAll('[data-add-q-grp]').forEach(btn => {
            btn.onclick = () => {
              const gIdx = Number(btn.dataset.addQGrp);
              pushUndoSnapshot('Ajout de question');
              const grp = draft.groups[gIdx];
              grp.questions.push(createEmptyQuestion('QCM', grp.questions.length + 1));
              render();
            };
          });

          const btnAddGrp = document.getElementById('btn-add-draft-group');
          if (btnAddGrp) btnAddGrp.onclick = () => {
            pushUndoSnapshot('Ajout de groupe');
            const ue = getUE(draft.targetPath.semesterId, draft.targetPath.ueId);
            const defaultSf = ue && ue.subFolders.length > 0 ? ue.subFolders[0].id : null;
            draft.groups.push({
              id: uid('grp'),
              semesterId: draft.targetPath.semesterId,
              ueId: draft.targetPath.ueId,
              subFolderId: defaultSf,
              title: `Groupe ${draft.groups.length + 1}`,
              questions: [createEmptyQuestion('QCM', 1)]
            });
            render();
          };

          document.querySelectorAll('[data-dq-type]').forEach(sel => {
            sel.onchange = () => {
              const [gIdx, qIdx] = sel.dataset.dqType.split('|').map(Number);
              pushUndoSnapshot('Changement de type de question');
              const q = draft.groups[gIdx].questions[qIdx];
              q.type = sel.value;
              if ((q.type === 'QCM' || q.type === 'QCU') && (!q.items || q.items.length === 0)) {
                q.items = ['A', 'B', 'C', 'D', 'E'].map(letter => ({ letter, text: '' }));
              }
              if (q.type === 'QCU' && q.correctAnswers.length > 1) q.correctAnswers = [q.correctAnswers[0]];
              render();
            };
          });

          document.querySelectorAll('[data-dq-sub]').forEach(inp => {
            inp.oninput = () => {
              const [gIdx, qIdx] = inp.dataset.dqSub.split('|').map(Number);
              draft.groups[gIdx].questions[qIdx].subtitle = inp.value;
            };
          });

          document.querySelectorAll('[data-dq-prompt]').forEach(ta => {
            ta.oninput = () => {
              const [gIdx, qIdx] = ta.dataset.dqPrompt.split('|').map(Number);
              draft.groups[gIdx].questions[qIdx].prompt = ta.value;
            };
          });

          document.querySelectorAll('[data-dq-model]').forEach(ta => {
            ta.oninput = () => {
              const [gIdx, qIdx] = ta.dataset.dqModel.split('|').map(Number);
              draft.groups[gIdx].questions[qIdx].modelAnswer = ta.value;
            };
          });

          document.querySelectorAll('[data-dq-item]').forEach(inp => {
            inp.oninput = () => {
              const [gIdx, qIdx, iIdx] = inp.dataset.dqItem.split('|').map(Number);
              draft.groups[gIdx].questions[qIdx].items[iIdx].text = inp.value;
            };
          });

          // Cycle Juste -> Toléré -> Neutre
          document.querySelectorAll('[data-dq-cycle-ans]').forEach(btn => {
            btn.onclick = () => {
              const [gIdx, qIdx, letter] = btn.dataset.dqCycleAns.split('|');
              pushUndoSnapshot('Modification corrigé / toléré');
              const q = draft.groups[Number(gIdx)].questions[Number(qIdx)];
              const isCor = q.correctAnswers.includes(letter);
              const isTol = q.toleratedAnswers.includes(letter);
              q.correctAnswers = q.correctAnswers.filter(x => x !== letter);
              q.toleratedAnswers = q.toleratedAnswers.filter(x => x !== letter);

              if (!isCor && !isTol) {
                if (q.type === 'QCU') q.correctAnswers = [letter];
                else q.correctAnswers.push(letter);
              } else if (isCor) {
                q.toleratedAnswers.push(letter);
              }
              q.correctAnswers.sort();
              q.toleratedAnswers.sort();
              render();
            };
          });

          document.querySelectorAll('[data-del-dq]').forEach(btn => {
            btn.onclick = () => {
              const [gIdx, qIdx] = btn.dataset.delDq.split('|').map(Number);
              pushUndoSnapshot('Suppression de question');
              draft.groups[gIdx].questions.splice(qIdx, 1);
              render();
            };
          });

          // Rognage PDF énoncé & zone de correction
          const bindCropTrigger = (selector, role) => {
            document.querySelectorAll(selector).forEach(btn => {
              btn.onclick = () => {
                const [gIdx, qIdx] = btn.dataset[role === 'correction' ? 'cropCorr' : 'cropStmt'].split('|').map(Number);
                const q = draft.groups[gIdx].questions[qIdx];
                openPdfCropModal(q.attachedPageNum || 1, role, (croppedUrl, usedPage) => {
                  pushUndoSnapshot(role === 'correction' ? 'Ajout zone de correction' : 'Rognage image énoncé');
                  const imgId = uid('img');
                  if (!q._pendingImgs) q._pendingImgs = {};
                  q._pendingImgs[imgId] = croppedUrl;
                  state.imageCache[imgId] = croppedUrl;
                  q.attachedPageNum = usedPage;
                  if (role === 'correction') q.correctionImageIds.push(imgId);
                  else q.imageIds.push(imgId);
                  showToast(role === 'correction' ? 'Zone de correction ajoutée.' : 'Image rognée ajoutée.', 'success');
                  render();
                });
              };
            });
          };
          bindCropTrigger('[data-crop-stmt]', 'statement');
          bindCropTrigger('[data-crop-corr]', 'correction');

          document.querySelectorAll('[data-dq-uploadimg]').forEach(inp => {
            inp.onchange = async (e) => {
              const file = e.target.files[0];
              if (!file) return;
              const [gIdx, qIdx] = inp.dataset.dqUploadimg.split('|').map(Number);
              const q = draft.groups[gIdx].questions[qIdx];
              const dataUrl = await compressExternalImageFile(file);
              if (dataUrl) {
                pushUndoSnapshot('Ajout image énoncé');
                const imgId = uid('img');
                if (!q._pendingImgs) q._pendingImgs = {};
                q._pendingImgs[imgId] = dataUrl;
                state.imageCache[imgId] = dataUrl;
                q.imageIds.push(imgId);
                render();
              }
            };
          });

          document.querySelectorAll('[data-dq-uploadcorr]').forEach(inp => {
            inp.onchange = async (e) => {
              const file = e.target.files[0];
              if (!file) return;
              const [gIdx, qIdx] = inp.dataset.dqUploadcorr.split('|').map(Number);
              const q = draft.groups[gIdx].questions[qIdx];
              const dataUrl = await compressExternalImageFile(file);
              if (dataUrl) {
                pushUndoSnapshot('Ajout image correction');
                const imgId = uid('img');
                if (!q._pendingImgs) q._pendingImgs = {};
                q._pendingImgs[imgId] = dataUrl;
                state.imageCache[imgId] = dataUrl;
                q.correctionImageIds.push(imgId);
                render();
              }
            };
          });

          document.querySelectorAll('[data-rm-stmt-img]').forEach(btn => {
            btn.onclick = () => {
              const [gIdx, qIdx, imgIdx] = btn.dataset.rmStmtImg.split('|').map(Number);
              pushUndoSnapshot('Retrait image énoncé');
              draft.groups[gIdx].questions[qIdx].imageIds.splice(imgIdx, 1);
              render();
            };
          });

          document.querySelectorAll('[data-rm-corr-img]').forEach(btn => {
            btn.onclick = () => {
              const [gIdx, qIdx, imgIdx] = btn.dataset.rmCorrImg.split('|').map(Number);
              pushUndoSnapshot('Retrait image correction');
              draft.groups[gIdx].questions[qIdx].correctionImageIds.splice(imgIdx, 1);
              render();
            };
          });

          const saveAllDraft = async () => {
            const validGroups = draft.groups.filter(g => g.questions.length > 0);
            if (validGroups.length === 0) {
              showToast('Ajoutez au moins une question avant d\'enregistrer.', 'warning');
              return;
            }

            for (const g of validGroups) {
              const gSemId = g.semesterId || draft.targetPath.semesterId;
              const gSem = getSemester(gSemId) || CURRICULUM[0];
              const gUeId = g.ueId || gSem.ues[0]?.id;
              const gUe = getUE(gSem.id, gUeId) || gSem.ues[0];
              const defaultSf = gUe && gUe.subFolders.length > 0 ? gUe.subFolders[0].id : null;

              const cleanQuestions = [];
              for (const q of g.questions) {
                const media = normalizeQuestionMedia(q);
                const finalImageIds = [];
                const finalCorrIds = [];

                for (const id of media.imageIds) {
                  const url = q._pendingImgs?.[id] || state.imageCache[id];
                  if (url) {
                    const newId = id.startsWith('img_') ? id : uid('img');
                    await saveImage(newId, url);
                    finalImageIds.push(newId);
                  }
                }
                for (const id of media.correctionImageIds) {
                  const url = q._pendingImgs?.[id] || state.imageCache[id];
                  if (url) {
                    const newId = id.startsWith('img_') ? id : uid('img');
                    await saveImage(newId, url);
                    finalCorrIds.push(newId);
                  }
                }

                cleanQuestions.push({
                  id: q.id || uid('q'),
                  origNumber: q.origNumber || 1,
                  subtitle: (q.subtitle || '').trim(),
                  type: q.type,
                  prompt: (q.prompt || '').trim() || '(Énoncé vide)',
                  items: (q.type === 'QCM' || q.type === 'QCU') ? (q.items || []) : [],
                  correctAnswers: (q.type === 'QCM' || q.type === 'QCU') ? media.correctAnswers : [],
                  toleratedAnswers: (q.type === 'QCM' || q.type === 'QCU') ? media.toleratedAnswers : [],
                  modelAnswer: (q.modelAnswer || '').trim(),
                  courseNotes: (q.courseNotes || '').trim(),
                  imageIds: finalImageIds,
                  correctionImageIds: finalCorrIds
                });
              }

              const grpDoc = {
                id: g.id || uid('grp'),
                semesterId: gSem.id,
                ueId: gUe ? gUe.id : gUeId,
                year: draft.targetPath.year,
                session: Number(draft.targetPath.session),
                subFolderId: gUe && gUe.subFolders.length > 0 ? (g.subFolderId || defaultSf) : null,
                title: (g.title || '').trim() || 'Groupe sans titre',
                createdAt: g.createdAt || Date.now(),
                updatedAt: Date.now(),
