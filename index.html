      const CURRICULUM = [

          ues: [
            {

                { id: 'orl', name: 'ORL' },

            { id: 'ue4', code: 'UE4', name: 'Biomédecine quantitative', subFolders: [] },
            { id: 'ue5', code: 'UE5', name: 'Anglais', subFolders: [] },

            {
              id: 'ue7',

              subFolders: [
                { id: 'heaap', name: 'HEAAP' },
                { id: 'physio_pharmaco', name: 'Physio / Pharmaco' },

              ]
            },

              subFolders: [

        {

          ues: [
            {
              id: 'ue8_mp',

                { id: 'semio', name: 'Sémiologie' },

            },

        {

          ues: [
            { id: 'ue10', code: 'UE10', name: 'Urgence', subFolders: [] },

              ]

          ]
        }
      ];

      const QUESTION_TYPES = {
        QCM: {
          label: 'QCM',
          full: 'Choix multiples (1 / 0,5 / 0,2 / 0 pt)',
          maxPoints: 1,
          badge: 'bg-blue-100 text-blue-800 dark:bg-blue-900/50 dark:text-blue-300'
        },
        QCU: {
          label: 'QCU',
          full: 'Choix unique (0 ou 1 pt)',
          maxPoints: 1,
          badge: 'bg-indigo-100 text-indigo-800 dark:bg-indigo-900/50 dark:text-indigo-300'
        },
        QROC: {
          label: 'QROC',
          full: 'Réponse ouverte courte (0 ou 1 pt)',
          maxPoints: 1,
          badge: 'bg-teal-100 text-teal-800 dark:bg-teal-900/50 dark:text-teal-300'
        },
        QROL: {
          label: 'QROL',
          full: 'Réponse ouverte longue (sur 7 pts, demi-points)',
          maxPoints: 7,
          badge: 'bg-purple-100 text-purple-800 dark:bg-purple-900/50 dark:text-purple-300'
        }
      };

      const QROL_SCORES = [0, 0.5, 1, 1.5, 2, 2.5, 3, 3.5, 4, 4.5, 5, 5.5, 6, 6.5, 7];

      /* =========================================================================
         2. COUCHE DE PERSISTANCE LOCALE : INDEXEDDB AVEC FALLBACK LOCALSTORAGE
         ========================================================================= */

      const DB_NAME = 'DFGSM3AnnalesDB_v2';
      const DB_VERSION = 1;
      const LS_PREFIX = 'dfgsm3_annales_v2_';

      const Storage = {
        db: null,
        mode: 'indexeddb',

        async init() {
          if (!('indexedDB' in window)) {
            this.mode = 'localstorage';
            return;
          }
          try {
            this.db = await new Promise((resolve, reject) => {
              const req = indexedDB.open(DB_NAME, DB_VERSION);
              req.onupgradeneeded = (e) => {
                const db = e.target.result;
                if (!db.objectStoreNames.contains('groups')) db.createObjectStore('groups', { keyPath: 'id' });
                if (!db.objectStoreNames.contains('attempts')) db.createObjectStore('attempts', { keyPath: 'id' });
                if (!db.objectStoreNames.contains('images')) db.createObjectStore('images', { keyPath: 'id' });
                if (!db.objectStoreNames.contains('settings')) db.createObjectStore('settings', { keyPath: 'key' });
              };
              req.onsuccess = () => resolve(req.result);
              req.onerror = () => reject(req.error);
            });
            this.mode = 'indexeddb';
          } catch (err) {
            console.warn('IndexedDB indisponible, bascule localStorage :', err);
            this.mode = 'localstorage';
          }
        },

        _lsReadMap(storeName) {
          try {
            const raw = localStorage.getItem(LS_PREFIX + storeName);
            return raw ? JSON.parse(raw) : {};
          } catch {
            return {};
          }
        },

        _lsWriteMap(storeName, map) {
          try {
            localStorage.setItem(LS_PREFIX + storeName, JSON.stringify(map));
          } catch (err) {
            console.error('Quota localStorage dépassé :', err);
            showToast('Espace navigateur plein : exportez votre sauvegarde JSON.', 'warning');
          }
        },

        async getAll(storeName) {
          if (this.mode === 'indexeddb' && this.db) {
            return new Promise((resolve, reject) => {
              const tx = this.db.transaction(storeName, 'readonly');
              const req = tx.objectStore(storeName).getAll();
              req.onsuccess = () => resolve(req.result || []);
              req.onerror = () => reject(req.error);
            });
          }
          return Object.values(this._lsReadMap(storeName));
        },

        async get(storeName, key) {
          if (this.mode === 'indexeddb' && this.db) {
            return new Promise((resolve, reject) => {
              const tx = this.db.transaction(storeName, 'readonly');
              const req = tx.objectStore(storeName).get(key);
              req.onsuccess = () => resolve(req.result || null);
              req.onerror = () => reject(req.error);
            });
          }
          return this._lsReadMap(storeName)[key] || null;
        },

        async put(storeName, record) {
          if (this.mode === 'indexeddb' && this.db) {
            return new Promise((resolve, reject) => {
              const tx = this.db.transaction(storeName, 'readwrite');
              const req = tx.objectStore(storeName).put(record);
              req.onsuccess = () => resolve();
              req.onerror = () => reject(req.error);
            });
          }
          const keyField = storeName === 'settings' ? 'key' : 'id';
          const map = this._lsReadMap(storeName);
          map[record[keyField]] = record;
          this._lsWriteMap(storeName, map);
        },

        async delete(storeName, key) {
          if (this.mode === 'indexeddb' && this.db) {
            return new Promise((resolve, reject) => {
              const tx = this.db.transaction(storeName, 'readwrite');
              const req = tx.objectStore(storeName).delete(key);
              req.onsuccess = () => resolve();
              req.onerror = () => reject(req.error);
            });
          }
          const map = this._lsReadMap(storeName);
          delete map[key];
          this._lsWriteMap(storeName, map);
        }
      };

      /* =========================================================================
         3. ÉTAT GLOBAL & HISTORIQUE UNDO MULTI-ÉTAPES
         ========================================================================= */

      const state = {
        storageReady: false,
        storageLabel: 'Stockage local…',
        darkMode: false,
        customYearsByUe: {},
        groups: [],
        attempts: [],
        imageCache: {},
        pdfDocCache: null,

        view: 'explorer', // 'explorer' | 'import' | 'editGroup' | 'quiz' | 'results' | 'history' | 'reviewAttempt'
        mobileSidebarOpen: false,

        nav: {
          semesterId: 's1',
          ueId: null,
          year: null,
          session: null,
          subFolderId: null
        },

        importDraft: null,
        undoStack: [],
        redoStack: [],

        quiz: null,
        lastAttempt: null,
        reviewAttempt: null,

        historyFilter: {
          semesterId: 'all',
          ueId: 'all'
        }
      };

      function pushUndoSnapshot(label = 'Action') {
        if (!state.importDraft) return;
        const snap = {
          label,
          groups: JSON.parse(JSON.stringify(state.importDraft.groups))
        };
        state.undoStack.push(snap);
        if (state.undoStack.length > 40) state.undoStack.shift();
        state.redoStack = [];
      }

      function performUndo() {
        if (!state.importDraft || state.undoStack.length === 0) return false;
        const prev = state.undoStack.pop();
        state.redoStack.push({
          label: prev.label,
          groups: JSON.parse(JSON.stringify(state.importDraft.groups))
        });
        state.importDraft.groups = prev.groups;
        showToast(`Annulé : ${prev.label}`, 'info');
        render();
        return true;
      }

      /* =========================================================================
         4. UTILITAIRES & HELPERS PÉDAGOGIQUES
         ========================================================================= */

      function uid(prefix = 'id') {
        if (window.crypto && crypto.randomUUID) {
          return `${prefix}_${crypto.randomUUID().replace(/-/g, '').slice(0, 14)}`;
        }
        return `${prefix}_${Date.now().toString(36)}_${Math.random().toString(36).slice(2, 9)}`;
      }

      function escapeHtml(str) {
        if (str === null || str === undefined) return '';
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function formatRichText(text) {
        if (!text || !text.trim()) return '';
        let safe = escapeHtml(text.trim());
        safe = safe.replace(/\*\*(.+?)\*\*/g, '<strong class="font-semibold text-slate-900 dark:text-white">$1</strong>');
        safe = safe.replace(/__(.+?)__/g, '<span class="underline">$1</span>');
        safe = safe.replace(/\n/g, '<br />');
        return safe;
      }

      function formatNumber(n, decimals = 2) {
        if (typeof n !== 'number' || Number.isNaN(n)) return '0';
        const f = Math.pow(10, decimals);
        return (Math.round(n * f) / f).toString().replace('.', ',');
      }

      function formatDate(ms) {
        try {
          return new Date(ms).toLocaleDateString('fr-FR', {
            day: '2-digit',
            month: 'short',
            year: 'numeric',
            hour: '2-digit',
            minute: '2-digit'
          });
        } catch {
          return '—';
        }
      }

      function getSemester(semId) {
        return CURRICULUM.find(s => s.id === semId) || null;
      }

      function getUE(semId, ueId) {
        const sem = getSemester(semId);
        return sem ? (sem.ues.find(u => u.id === ueId) || null) : null;
      }

      function findUEInAnySemester(ueId) {
        for (const s of CURRICULUM) {
          const found = s.ues.find(u => u.id === ueId);
          if (found) return { semester: s, ue: found };
        }
        return null;
      }

      function getSubFolder(semId, ueId, subId) {
        const ue = getUE(semId, ueId);
        if (!ue || !subId) return null;
        return ue.subFolders.find(sf => sf.id === subId) || null;
      }

      /** Normalise les images d'une question (rétrocompatibilité imageId unique + tableaux multiples) */
      function normalizeQuestionMedia(q) {
        const imageIds = Array.isArray(q.imageIds)
          ? q.imageIds.filter(Boolean)
          : (q.imageId ? [q.imageId] : []);
        const correctionImageIds = Array.isArray(q.correctionImageIds)
          ? q.correctionImageIds.filter(Boolean)
          : (q.correctionImageId ? [q.correctionImageId] : []);
        return {
          imageIds,
          correctionImageIds,
          correctAnswers: Array.isArray(q.correctAnswers) ? q.correctAnswers : [],
          toleratedAnswers: Array.isArray(q.toleratedAnswers) ? q.toleratedAnswers : []
        };
      }

      function getYearsForUe(semId, ueId) {
        const set = new Set(DEFAULT_YEARS);
        const ueKey = `${semId}_${ueId}`;
        if (Array.isArray(state.customYearsByUe[ueKey])) {
          state.customYearsByUe[ueKey].forEach(y => set.add(y));
        }
        state.groups.forEach(g => {
          if (g.semesterId === semId && g.ueId === ueId && g.year) set.add(g.year);
        });
        return Array.from(set).sort((a, b) => b.localeCompare(a));
      }

      function countGroupsFor(filter) {
        return state.groups.filter(g => {
          if (filter.semesterId && g.semesterId !== filter.semesterId) return false;
          if (filter.ueId && g.ueId !== filter.ueId) return false;
          if (filter.year && g.year !== filter.year) return false;
          if (filter.session !== undefined && filter.session !== null && Number(g.session) !== Number(filter.session)) return false;
          if (filter.subFolderId !== undefined) {
            if ((g.subFolderId || null) !== (filter.subFolderId || null)) return false;
          }
          return true;
        }).length;
      }

      function getGroupsForSession(semId, ueId, year, session, subFolderId = undefined) {
        return state.groups
          .filter(g => {
            if (g.semesterId !== semId || g.ueId !== ueId || g.year !== year || Number(g.session) !== Number(session)) {
              return false;
            }
            if (subFolderId !== undefined) {
              return (g.subFolderId || null) === (subFolderId || null);
            }
            return true;
          })
          .sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
      }

      function getPathLabel(path) {
        const parts = [];
        const sem = getSemester(path.semesterId);
        if (sem) parts.push(sem.shortName);
        const ue = getUE(path.semesterId, path.ueId);
        if (ue) parts.push(`${ue.code} ${ue.name}`);
        if (path.year) parts.push(path.year);
        if (path.session) parts.push(`Session ${path.session}`);
        if (path.subFolderId) {
          const sf = getSubFolder(path.semesterId, path.ueId, path.subFolderId);
          if (sf) parts.push(sf.name);
        }
        return parts.join(' › ');
      }

      function getLastAttemptForGroup(groupId) {
        return state.attempts.find(a => Array.isArray(a.groupIds) && a.groupIds.length === 1 && a.groupIds[0] === groupId) || null;
      }

      function applyTheme() {
        document.documentElement.classList.toggle('dark', Boolean(state.darkMode));
      }

      function showToast(message, type = 'info') {
        const root = document.getElementById('toast-root');
        if (!root) return;
        const styles = {
          success: 'bg-emerald-600 text-white border-emerald-500',
          error: 'bg-red-600 text-white border-red-500',
          warning: 'bg-amber-500 text-white border-amber-400',
          info: 'bg-[#1E3A5F] text-white border-slate-700'
        };
        const el = document.createElement('div');
        el.className = `pointer-events-auto flex items-center gap-3 px-4 py-3 rounded-xl shadow-lg border text-sm font-medium transition-all duration-300 translate-y-2 opacity-0 ${styles[type] || styles.info}`;
        el.innerHTML = `<span class="flex-1">${escapeHtml(message)}</span>`;
        root.appendChild(el);
        requestAnimationFrame(() => el.classList.remove('translate-y-2', 'opacity-0'));
        setTimeout(() => {
          el.classList.add('opacity-0', 'translate-y-2');
          setTimeout(() => el.remove(), 300);
        }, 3500);
      }

      /* =========================================================================
         5. OPÉRATIONS DE SAUVEGARDE / CHARGEMENT EN BASE LOCALE
         ========================================================================= */

      async function loadAllFromStorage() {
        await Storage.init();
        state.storageLabel = Storage.mode === 'indexeddb' ? 'IndexedDB actif' : 'localStorage actif';

        const [groups, attempts, prefDoc, images] = await Promise.all([
          Storage.getAll('groups'),
          Storage.getAll('attempts'),
          Storage.get('settings', 'preferences'),
          Storage.getAll('images')
        ]);

        state.groups = groups || [];
        state.attempts = (attempts || []).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));

        if (prefDoc) {
          state.darkMode = Boolean(prefDoc.darkMode);
          state.customYearsByUe = prefDoc.customYearsByUe || {};
          applyTheme();
        }

        state.imageCache = {};
        (images || []).forEach(img => {
          if (img && img.id && img.dataUrl) state.imageCache[img.id] = img.dataUrl;
        });

        state.storageReady = true;
        render();
      }

      async function savePreferences() {
        await Storage.put('settings', {
          key: 'preferences',
          darkMode: state.darkMode,
          customYearsByUe: state.customYearsByUe,
          updatedAt: Date.now()
        });
      }

      async function saveGroup(group) {
        const idx = state.groups.findIndex(g => g.id === group.id);
        if (idx >= 0) state.groups[idx] = group;
        else state.groups.push(group);
        await Storage.put('groups', group);
      }

      async function deleteGroup(groupId) {
        state.groups = state.groups.filter(g => g.id !== groupId);
        await Storage.delete('groups', groupId);
        showToast('Groupe supprimé.', 'info');
        render();
      }

      async function saveAttempt(attempt) {
        const idx = state.attempts.findIndex(a => a.id === attempt.id);
        if (idx >= 0) state.attempts[idx] = attempt;
        else state.attempts.unshift(attempt);
        state.attempts.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
        await Storage.put('attempts', attempt);
      }

      async function deleteAttempt(attemptId) {
        state.attempts = state.attempts.filter(a => a.id !== attemptId);
        await Storage.delete('attempts', attemptId);
        showToast('Entrée retirée de l\'historique.', 'info');
        render();
      }

      async function saveImage(imageId, dataUrl) {
        if (!imageId || !dataUrl) return;
        state.imageCache[imageId] = dataUrl;
        await Storage.put('images', { id: imageId, dataUrl, createdAt: Date.now() });
      }

      async function updateQuestionInGroup(groupId, questionId, patch) {
        const group = state.groups.find(g => g.id === groupId);
        if (!group) return;
        const qIdx = (group.questions || []).findIndex(q => q.id === questionId);
        if (qIdx < 0) return;
        group.questions[qIdx] = { ...group.questions[qIdx], ...patch };
        group.updatedAt = Date.now();
        await saveGroup(group);
      }

      /* =========================================================================
         6. MOTEUR D'EXTRACTION PDF LOCAL & TABLEAUX DE CORRECTION ADAPTÉS
         ========================================================================= */

      function canvasToCompressedJpeg(canvas, qualityStart = 0.82) {
        let quality = qualityStart;
        let dataUrl = canvas.toDataURL('image/jpeg', quality);
        while (dataUrl.length > 1050000 && quality > 0.35) {
          quality -= 0.12;
          dataUrl = canvas.toDataURL('image/jpeg', quality);
        }
        return dataUrl;
      }

      async function renderPdfPageToJpeg(page, maxWidth = 1100) {
        const vp0 = page.getViewport({ scale: 1 });
        const scale = Math.min(2.0, maxWidth / Math.max(vp0.width, 1));
        const viewport = page.getViewport({ scale });
        const canvas = document.createElement('canvas');
        canvas.width = Math.round(viewport.width);
        canvas.height = Math.round(viewport.height);
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        await page.render({ canvasContext: ctx, viewport }).promise;
        return canvasToCompressedJpeg(canvas, 0.84);
      }

      async function getOrRenderPdfPage(pageNum, maxWidth = 1150) {
        if (!state.importDraft) return null;
        const found = state.importDraft.pageImages.find(p => p.pageNum === pageNum);
        if (found && found.dataUrl) return found.dataUrl;
        if (state.pdfDocCache && pageNum >= 1 && pageNum <= state.pdfDocCache.numPages) {
          const page = await state.pdfDocCache.getPage(pageNum);
          const url = await renderPdfPageToJpeg(page, maxWidth);
          if (found) found.dataUrl = url;
          else state.importDraft.pageImages.push({ pageNum, hasImage: true, dataUrl: url });
          return url;
        }
        return found ? found.dataUrl : null;
      }

      async function detectPdfPageHasImage(page) {
        try {
          const ops = await page.getOperatorList();
          const OPS = window.pdfjsLib.OPS;
          const imgOps = new Set([
            OPS.paintImageXObject,
            OPS.paintInlineImageXObject,
            OPS.paintJpegXObject,
            OPS.paintImageMaskXObject
          ]);
          for (let i = 0; i < ops.fnArray.length; i++) {
            if (imgOps.has(ops.fnArray[i])) return true;
          }
        } catch (err) {
          console.warn('Détection image page ignorée :', err);
        }
        return false;
      }

      /** Extrait lignes ordonnées + coordonnées X/Y pour grilles multi-colonnes */
      async function extractPageLayout(page) {
        const textContent = await page.getTextContent();
        const items = textContent.items.filter(it => it.str && it.str.trim().length > 0);
        if (!items.length) return { lines: [], cells: [] };

        const cells = items.map(it => ({
          x: it.transform[4],
          y: it.transform[5],
          width: it.width || 0,
          str: it.str.trim()
        }));

        const rows = [];
        for (const it of items) {
          const y = it.transform[5];
          const x = it.transform[4];
          let row = rows.find(r => Math.abs(r.y - y) <= 4.5);
          if (!row) {
            row = { y, chunks: [] };
            rows.push(row);
          }
          row.chunks.push({ x, str: it.str, width: it.width || 0 });
        }

        rows.sort((a, b) => b.y - a.y);
        const lines = [];
        for (const row of rows) {
          row.chunks.sort((a, b) => a.x - b.x);
          let line = '';
          let prevEnd = null;
          for (const ch of row.chunks) {
            const piece = ch.str;
            if (prevEnd !== null) {
              const gap = ch.x - prevEnd;
              if (gap > 2 && !line.endsWith(' ') && !piece.startsWith(' ')) {
                line += ' ';
              }
            }
            line += piece;
            prevEnd = ch.x + ch.width;
          }
          const cleaned = line.replace(/\s+/g, ' ').trim();
          if (cleaned) lines.push(cleaned);
        }
        return { lines, cells };
      }

      function isNoiseLine(line) {
        const t = line.trim();
        if (!t) return true;
        if (/^-?\s*annales\s+up\s+dfgsm3\s*-?$/i.test(t)) return true;
        if (/^\$?\s*\d{1,3}\s*\/\s*\d{1,3}\s*\$?$/.test(t)) return true;
        if (/^page\s+\d+(\s*(\/|sur)\s*\d+)?$/i.test(t)) return true;
        if (/^\d{1,3}$/.test(t)) return true;
        return false;
      }

      /** Parse une cellule de réponse : gère (X) toléré, ABC(E), (A)(B)(C)(D)(E), ou texte QROC */
      function parseAnswerCellToken(rawText) {
        const t = (rawText || '').trim();
        if (!t) return null;

        // Détecte une suite de lettres avec parenthèses éventuelles, ex: AC(E), (A)BCE, A(B)(C)E, (A)(B)(C)(D)(E)
        const choicePattern = /^(?:\(?[A-J]\)?[\s,/\-]*)+$/i;
        if (choicePattern.test(t)) {
          const correct = [];
          const tolerated = [];
          const tokenRegex = /\(([A-J])\)|([A-J])/gi;
          let m;
          while ((m = tokenRegex.exec(t)) !== null) {
            if (m[1]) {
              const l = m[1].toUpperCase();
              if (!tolerated.includes(l)) tolerated.push(l);
            } else if (m[2]) {
              const l = m[2].toUpperCase();
              if (!correct.includes(l)) correct.push(l);
            }
          }
          // Si un même item apparaît juste et toléré, privilégier juste
          const cleanTol = tolerated.filter(l => !correct.includes(l));
          return {
            kind: 'choice',
            correctAnswers: correct.sort(),
            toleratedAnswers: cleanTol.sort()
          };
        }

        // Sinon réponse textuelle courte (QROC)
        return {
          kind: 'text',
          text: t
        };
      }

      /** Extraction multi-colonnes spatiale (X/Y) + linéaire, adaptée aux groupes détectés */
      function extractCorrectionsAdaptedToGroups(corrPagesData, groups) {
        // 1. Essai spatial multi-colonnes sur les pages de correction
        const allCells = [];
        const allLines = [];
        for (const pd of corrPagesData) {
          allLines.push(...(pd.lines || []));
          (pd.cells || []).forEach(c => allCells.push(c));
        }

        // Détecte les numéros de ligne (ex: 1..30) situés dans une colonne de gauche
        const rowNumCells = allCells.filter(c => /^\d{1,2}$/.test(c.str) && Number(c.str) >= 1 && Number(c.str) <= 80);
        if (rowNumCells.length >= 4) {
          const minX = Math.min(...rowNumCells.map(c => c.x));
          const numColCells = rowNumCells.filter(c => c.x - minX <= 35);

          // Regroupe les numéros par bandes Y
          const yBands = [];
          for (const nc of numColCells) {
            let band = yBands.find(b => Math.abs(b.y - nc.y) <= 6);
            if (!band) {
              band = { y: nc.y, qNum: Number(nc.str), x: nc.x };
              yBands.push(band);
            }
          }

          // Trouve les cellules à droite du numéro sur la même ligne Y
          const rowEntries = [];
          for (const band of yBands) {
            const rightCells = allCells
              .filter(c => c.x > band.x + 12 && Math.abs(c.y - band.y) <= 6)
              .sort((a, b) => a.x - b.x);

            // Regroupe les fragments proches horizontalement en une cellule
            const mergedCells = [];
            for (const rc of rightCells) {
              if (isNoiseLine(rc.str) || /^correction/i.test(rc.str)) continue;
              const last = mergedCells[mergedCells.length - 1];
              if (last && (rc.x - (last.x + last.width)) < 16) {
                last.str += (last.str.endsWith(')') || rc.str.startsWith('(') ? '' : ' ') + rc.str;
                last.width = Math.max(last.width, (rc.x + rc.width) - last.x);
              } else {
                mergedCells.push({ x: rc.x, width: rc.width, str: rc.str.trim() });
              }
            }

            if (mergedCells.length > 0) {
              rowEntries.push({ qNum: band.qNum, cells: mergedCells });
            }
          }

          // Calcule les centres X des colonnes de réponses
          const colXCenters = [];
          for (const re of rowEntries) {
            re.cells.forEach((mc, cIdx) => {
              if (!colXCenters[cIdx]) colXCenters[cIdx] = [];
              colXCenters[cIdx].push(mc.x);
            });
          }

          if (colXCenters.length >= 2) {
            const avgColX = colXCenters.map(arr => arr.reduce((a, b) => a + b, 0) / arr.length);
            const gridByCol = avgColX.map(() => ({}));

            for (const re of rowEntries) {
              for (const mc of re.cells) {
                let bestCol = 0;
                let bestDist = Math.abs(mc.x - avgColX[0]);
                for (let c = 1; c < avgColX.length; c++) {
                  const d = Math.abs(mc.x - avgColX[c]);
                  if (d < bestDist) {
                    bestDist = d;
                    bestCol = c;
                  }
                }
                const parsed = parseAnswerCellToken(mc.str);
                if (parsed) {
                  gridByCol[bestCol][re.qNum] = parsed;
                }
              }
            }

            // Associe chaque colonne aux groupes du sujet dans l'ordre
            const mappedCount = Math.min(gridByCol.length, groups.length);
            let appliedAny = false;
            for (let gIdx = 0; gIdx < mappedCount; gIdx++) {
              const colMap = gridByCol[gIdx];
              const grp = groups[gIdx];
              for (const q of grp.questions) {
                const entry = colMap[q.origNumber];
                if (!entry) continue;
                if (entry.kind === 'choice') {
                  q.correctAnswers = entry.correctAnswers;
                  q.toleratedAnswers = entry.toleratedAnswers;
                  appliedAny = true;
                } else if (entry.kind === 'text' && (q.type === 'QROC' || q.type === 'QROL')) {
                  if (!q.modelAnswer) q.modelAnswer = entry.text;
                  appliedAny = true;
                }
              }
            }
            if (appliedAny) return;
          }
        }

        // 2. Fallback linéaire (ex: 1.ACD | 2.AD | 3.AB(E)...)
        const joined = allLines.join(' | ');
        const map = {};
        const regex = /(?:^|[\s|;,])(?:Q\s*)?(\d{1,3})\s*[.\-–—:)]\s*((?:\(?[A-J]\)?[\s,/\-]*)+)(?=$|[\s|;,.])/gi;
        let m;
        while ((m = regex.exec(joined)) !== null) {
          const num = parseInt(m[1], 10);
          const parsed = parseAnswerCellToken(m[2]);
          if (!Number.isNaN(num) && parsed && parsed.kind === 'choice' && (parsed.correctAnswers.length + parsed.toleratedAnswers.length) > 0) {
            if (!map[num]) map[num] = [];
            map[num].push(parsed);
          }
        }

        const usedIdxMap = {};
        for (const grp of groups) {
          for (const q of grp.questions) {
            if (q.type === 'QCM' || q.type === 'QCU') {
              const list = map[q.origNumber];
              if (list && list.length > 0) {
                const useIdx = usedIdxMap[q.origNumber] || 0;
                const chosen = list[Math.min(useIdx, list.length - 1)];
                q.correctAnswers = chosen.correctAnswers;
                q.toleratedAnswers = chosen.toleratedAnswers;
                usedIdxMap[q.origNumber] = useIdx + 1;
              }
            }
          }
        }
      }

      /** Découpe les pages PDF en groupes neutres (nouveau groupe à chaque retour à 1 ou balise DL/DP/QI) */
      function parseMedicalPdfPages(pagesData, defaultSubFolderId) {
        let corrPageIdx = -1;
        let corrLineIdx = -1;

        for (let p = 0; p < pagesData.length; p++) {
          const lines = pagesData[p].lines;
          for (let l = 0; l < lines.length; l++) {
            if (/^(correction|corrig[ée]s?|grille\s+de\s+correction|r[ée]ponses\s+officielles?)\b/i.test(lines[l].trim())) {
              const sample = [
                ...lines.slice(l + 1),
                ...(pagesData[p + 1]?.lines || [])
              ].join(' ');
              if (/\b1\s*[.\-–—:)]\s*\(?[A-E]\)?/i.test(sample) || p >= Math.floor(pagesData.length * 0.5)) {
                corrPageIdx = p;
                corrLineIdx = l;
                break;
              }
            }
          }
          if (corrPageIdx !== -1) break;
        }

        const contentEntries = [];
        const corrPagesData = [];

        for (let p = 0; p < pagesData.length; p++) {
          const pd = pagesData[p];
          if (corrPageIdx !== -1 && p > corrPageIdx) {
            corrPagesData.push(pd);
          } else if (corrPageIdx !== -1 && p === corrPageIdx) {
            for (let l = 0; l < corrLineIdx; l++) contentEntries.push({ text: pd.lines[l], pageNum: pd.pageNum });
            corrPagesData.push({
              pageNum: pd.pageNum,
              lines: pd.lines.slice(corrLineIdx + 1),
              cells: pd.cells || []
            });
          } else {
            for (const line of pd.lines) contentEntries.push({ text: line, pageNum: pd.pageNum });
          }
        }

        const questionHeaderRegex = /^(?:Question|QCM|QCU|QROC|QROL|Q\.?)\s*(?:n[°o]\s*)?(\d{1,3})\b(.*)$/i;
        const sectionTagRegex = /^(?:#\s*)?(DL\s*\d+\s*[:\-–—]?\s*.+|DL\s+[A-ZÉÈÊÀÂÎÔÛÇ\-]+.*|QI\s+[A-ZÉÈÊÀÂÎÔÛÇ\-]+.*|DP\d*\s+[A-ZÉÈÊÀÂÎÔÛÇ\-]+.*|\bCR\b.*)$/i;
        const ALL_LETTERS = ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H', 'I', 'J'];

        const rawGroups = [];
        let pendingGroupTitle = null;
        let currentGroup = null;
        let currentQ = null;
        let lastNumInGroup = 0;

        const finalizeQuestion = () => {
          if (!currentQ) return;
          currentQ.prompt = currentQ.prompt.replace(/[ \t]+/g, ' ').trim();
          currentQ.items = currentQ.items.map(it => ({
            letter: it.letter,
            text: it.text.replace(/\s+/g, ' ').trim()
          }));

          const fullHeader = `${currentQ.headerExtra} ${currentQ.prompt}`.toLowerCase();
          const isExplicitQCU = /(r[ée]ponse\s+unique|choix\s+unique|\bqcu\b|une\s+seule\s+r[ée]ponse)/i.test(fullHeader);

          if (currentQ.items.length >= 2) {
            currentQ.type = isExplicitQCU ? 'QCU' : 'QCM';
          } else {
            const isLong =
              /(d[ée]cri(?:vez|re)|expliquez|d[ée]tail|complications|topographies|2a\s*-|1a\s*-|a\)|b\))/i.test(currentQ.prompt) ||
              currentQ.prompt.length > 105 ||
              currentQ.pages.length > 1;
            currentQ.type = isLong ? 'QROL' : 'QROC';
          }

          const cleanSub = currentQ.headerExtra
            .replace(/question\s+[àa]\s+r[ée]ponse\s+unique/i, '')
            .replace(/^[\s\-–—:]+/, '')
            .trim();

          let attachedPageNum = null;
          for (const pNum of currentQ.pages) {
            const pInfo = pagesData.find(x => x.pageNum === pNum);
            if (pInfo && pInfo.hasImage) {
              attachedPageNum = pNum;
              break;
            }
          }

          currentGroup.questions.push({
            id: uid('q'),
            origNumber: currentQ.origNumber,
            subtitle: cleanSub,
            type: currentQ.type,
            prompt: currentQ.prompt || '(Énoncé à compléter)',
            items: currentQ.items,
            correctAnswers: [],
            toleratedAnswers: [],
            modelAnswer: '',
            courseNotes: '',
            attachedPageNum,
            imageIds: [],
            correctionImageIds: []
          });
          currentQ = null;
        };

        for (const entry of contentEntries) {
          const line = entry.text.trim();
          if (isNoiseLine(line)) {
            if (currentQ && !currentQ.pages.includes(entry.pageNum)) {
              const pInfo = pagesData.find(x => x.pageNum === entry.pageNum);
              if (pInfo && pInfo.hasImage) currentQ.pages.push(entry.pageNum);
            }
            continue;
          }

          // Détecte une balise de section / bloc (ex. DL 1 : Physio-pharmaco, DL OPHTA, QI ORL-CMF)
          const secMatch = line.match(sectionTagRegex);
          if (secMatch && !questionHeaderRegex.test(line)) {
            finalizeQuestion();
            const cleanedTag = line.replace(/^#\s*/, '').trim();
            if (currentGroup && currentGroup.questions.length === 0) {
              currentGroup.title = cleanedTag;
            } else {
              pendingGroupTitle = cleanedTag;
              currentGroup = null;
              lastNumInGroup = 0;
            }
            continue;
          }

          const qMatch = line.match(questionHeaderRegex);
          if (qMatch) {
            const qNum = parseInt(qMatch[1], 10);
            const extra = (qMatch[2] || '').trim();
            if (qNum > 0 && qNum <= 250) {
              finalizeQuestion();

              if (!currentGroup || qNum <= lastNumInGroup || pendingGroupTitle) {
                const idx = rawGroups.length;
                currentGroup = {
                  id: uid('grp'),
                  title: pendingGroupTitle || `Groupe ${idx + 1}`,
                  subFolderId: defaultSubFolderId || null,
                  questions: []
                };
                pendingGroupTitle = null;
                rawGroups.push(currentGroup);
              }
              lastNumInGroup = qNum;

              currentQ = {
                origNumber: qNum,
                headerExtra: extra,
                prompt: '',
                items: [],
                pages: [entry.pageNum]
              };
              continue;
            }
          }

          if (!currentQ) continue;
          if (!currentQ.pages.includes(entry.pageNum)) {
            currentQ.pages.push(entry.pageNum);
          }

          const nextExpected = ALL_LETTERS[currentQ.items.length];
          let matchedItem = null;

          const strictMatch = line.match(/^([A-J])\s*[-–—.):]\s*(.+)$/);
          if (strictMatch && !currentQ.items.some(i => i.letter === strictMatch[1])) {
            matchedItem = { letter: strictMatch[1], text: strictMatch[2] };
          }

          if (!matchedItem && nextExpected) {
            const looseMatch = line.match(new RegExp(`^${nextExpected}\\s+(.+)$`));
            if (looseMatch && (currentQ.prompt.length > 0 || currentQ.items.length > 0)) {
              matchedItem = { letter: nextExpected, text: looseMatch[1] };
            }
          }

          if (!matchedItem && nextExpected && currentQ.items.length >= 1) {
            const gluedMatch = line.match(new RegExp(`^${nextExpected}([a-zàâäéèêëîïôöùûüç].{3,})$`));
            if (gluedMatch) {
              matchedItem = { letter: nextExpected, text: gluedMatch[1] };
            }
          }

          if (matchedItem) {
            currentQ.items.push(matchedItem);
          } else if (currentQ.items.length > 0) {
            currentQ.items[currentQ.items.length - 1].text += ' ' + line;
          } else {
            currentQ.prompt += (currentQ.prompt ? '\n' : '') + line;
          }
        }

        finalizeQuestion();

        // Applique les corrections adaptées aux groupes détectés
        extractCorrectionsAdaptedToGroups(corrPagesData, rawGroups);

        return rawGroups;
      }

      async function handlePdfFileUpload(file) {
        if (!file || !file.name.toLowerCase().endsWith('.pdf')) {
          showToast('Veuillez sélectionner un fichier PDF valide.', 'error');
          return;
        }
        if (!window.pdfjsLib) {
          showToast('Le module PDF.js n\'est pas disponible.', 'error');
          return;
        }

        const draft = state.importDraft;
        const ue = getUE(draft.targetPath.semesterId, draft.targetPath.ueId);
        const defaultSf = draft.targetPath.subFolderId || (ue && ue.subFolders.length > 0 ? ue.subFolders[0].id : null);

        draft.pdfName = file.name;
        draft.isParsing = true;
        draft.parseProgress = 5;
        draft.parseStatus = 'Ouverture du fichier PDF…';
        render();

        try {
          const arrayBuffer = await file.arrayBuffer();
          const pdf = await window.pdfjsLib.getDocument({ data: arrayBuffer }).promise;
          state.pdfDocCache = pdf;
          const numPages = pdf.numPages;

          const pagesData = [];
          const pageImages = [];

          for (let p = 1; p <= numPages; p++) {
            draft.parseProgress = Math.round(10 + (p / numPages) * 75);
            draft.parseStatus = `Extraction de la page ${p} / ${numPages}…`;
            render();

            const page = await pdf.getPage(p);
            const layout = await extractPageLayout(page);
            const hasImage = await detectPdfPageHasImage(page);
            let dataUrl = null;
            if (hasImage) {
              draft.parseStatus = `Rendu de la figure page ${p} / ${numPages}…`;
              render();
              dataUrl = await renderPdfPageToJpeg(page, 1050);
            }
            pagesData.push({ pageNum: p, lines: layout.lines, cells: layout.cells, hasImage });
            pageImages.push({ pageNum: p, hasImage, dataUrl });
          }

          draft.parseProgress = 92;
          draft.parseStatus = 'Découpage des groupes & alignement des corrections…';
          render();

          const groups = parseMedicalPdfPages(pagesData, defaultSf);
          state.undoStack = [];
          state.redoStack = [];

          if (groups.length === 0) {
            showToast('Aucune question détectée automatiquement. Ajoutez ou éditez vos questions manuellement.', 'warning');
            groups.push({
              id: uid('grp'),
              semesterId: draft.targetPath.semesterId,
              ueId: draft.targetPath.ueId,
              subFolderId: defaultSf,
              title: file.name.replace(/\.pdf$/i, ''),
              questions: [createEmptyQuestion('QCM', 1)]
            });
          } else {
            const totalQ = groups.reduce((acc, g) => acc + g.questions.length, 0);
            showToast(`${groups.length} groupe(s) et ${totalQ} question(s) extraits.`, 'success');
          }

          draft.pageImages = pageImages;
          draft.groups = groups;
          draft.isParsing = false;
          draft.parseProgress = 100;
          render();
        } catch (err) {
          console.error('Erreur lecture PDF :', err);
          draft.isParsing = false;
          showToast('Impossible d\'analyser ce PDF.', 'error');
          render();
        }
      }

      function createEmptyQuestion(type = 'QCM', origNumber = 1) {
        const isChoice = type === 'QCM' || type === 'QCU';
        return {
          id: uid('q'),
          origNumber,
          subtitle: '',
          type,
          prompt: '',
          items: isChoice ? ['A', 'B', 'C', 'D', 'E'].map(letter => ({ letter, text: '' })) : [],
          correctAnswers: [],
          toleratedAnswers: [],
          modelAnswer: '',
          courseNotes: '',
          attachedPageNum: null,
          imageIds: [],
          correctionImageIds: []
        };
      }

      function compressExternalImageFile(file) {
        return new Promise((resolve) => {
          const reader = new FileReader();
          reader.onload = (ev) => {
            const img = new Image();
            img.onload = () => {
              const scale = Math.min(1, 1050 / Math.max(img.width, 1));
              const canvas = document.createElement('canvas');
              canvas.width = Math.round(img.width * scale);
              canvas.height = Math.round(img.height * scale);
              const ctx = canvas.getContext('2d');
              ctx.fillStyle = '#ffffff';
              ctx.fillRect(0, 0, canvas.width, canvas.height);
              ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
              resolve(canvasToCompressedJpeg(canvas, 0.84));
            };
            img.onerror = () => resolve(null);
            img.src = ev.target.result;
          };
          reader.onerror = () => resolve(null);
          reader.readAsDataURL(file);
        });
      }

      /* =========================================================================
         7. OUTIL INTERACTIF DE ROGNAGE PDF (ÉNONCÉ & ZONE DE CORRECTION)
         ========================================================================= */

      function openPdfCropModal(initialPageNum, targetRole, onCroppedDataUrl) {
        const totalPages = state.pdfDocCache
          ? state.pdfDocCache.numPages
          : (state.importDraft?.pageImages?.length || 1);

        let currentPage = Math.min(Math.max(1, Number(initialPageNum) || 1), Math.max(1, totalPages));
        let pageDataUrl = null;
        let rectPx = null; // { x, y, w, h } en coordonnées canvas affichées
        let dragging = false;
        let startPt = null;

        const root = document.getElementById('modal-root');
        const isCorrectionZone = targetRole === 'correction';

        const drawOverlay = () => {
          const imgEl = document.getElementById('crop-base-img');
          const canvasEl = document.getElementById('crop-overlay-canvas');
          if (!imgEl || !canvasEl) return;
          canvasEl.width = imgEl.clientWidth;
          canvasEl.height = imgEl.clientHeight;
          const ctx = canvasEl.getContext('2d');
          ctx.clearRect(0, 0, canvasEl.width, canvasEl.height);

          if (rectPx && rectPx.w > 4 && rectPx.h > 4) {
            ctx.fillStyle = 'rgba(15, 23, 42, 0.42)';
            ctx.fillRect(0, 0, canvasEl.width, canvasEl.height);
            ctx.clearRect(rectPx.x, rectPx.y, rectPx.w, rectPx.h);
            ctx.strokeStyle = isCorrectionZone ? '#10B981' : '#2563EB';
            ctx.lineWidth = 2.5;
            ctx.strokeRect(rectPx.x, rectPx.y, rectPx.w, rectPx.h);
          }
        };

        const loadPage = async (pNum) => {
          currentPage = pNum;
          rectPx = null;
          pageDataUrl = await getOrRenderPdfPage(currentPage, 1200);
          renderCropModal();
        };

        const renderCropModal = () => {
          root.innerHTML = `
            <div class="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-3 sm:p-5">
              <div class="bg-white dark:bg-slate-900 rounded-2xl shadow-2xl border border-slate-200 dark:border-slate-800 max-w-4xl w-full max-h-[94vh] flex flex-col overflow-hidden">

          if (nextBtn) nextBtn.onclick = () => loadPage(currentPage + 1);

          const canvasEl = document.getElementById('crop-overlay-canvas');
          if (imgEl && canvasEl) {
            if (imgEl.complete) drawOverlay();
            else imgEl.onload = drawOverlay;

            const getLocalPt = (ev) => {
              const r = canvasEl.getBoundingClientRect();
              const clientX = ev.touches ? ev.touches[0].clientX : ev.clientX;
              const clientY = ev.touches ? ev.touches[0].clientY : ev.clientY;
              return {
                x: Math.max(0, Math.min(r.width, clientX - r.left)),
                y: Math.max(0, Math.min(r.height, clientY - r.top))
              };
            };

            const onDown = (ev) => {
              ev.preventDefault();
              dragging = true;
              startPt = getLocalPt(ev);
              rectPx = { x: startPt.x, y: startPt.y, w: 0, h: 0 };
              drawOverlay();
            };

            const onMove = (ev) => {
              if (!dragging || !startPt) return;
              ev.preventDefault();
              const pt = getLocalPt(ev);
              rectPx = {
                x: Math.min(startPt.x, pt.x),
                y: Math.min(startPt.y, pt.y),
                w: Math.abs(pt.x - startPt.x),
                h: Math.abs(pt.y - startPt.y)
              };
              drawOverlay();
            };

            const onUp = () => {
              dragging = false;
              startPt = null;
            };

            canvasEl.addEventListener('mousedown', onDown);
            window.addEventListener('mousemove', onMove);
            window.addEventListener('mouseup', onUp, { once: false });
            canvasEl.addEventListener('touchstart', onDown, { passive: false });
            canvasEl.addEventListener('touchmove', onMove, { passive: false });
            window.addEventListener('touchend', onUp);
          }

          document.getElementById('crop-confirm').onclick = () => {
            if (!pageDataUrl) return;
            const srcImg = new Image();
            srcImg.onload = () => {
              const outCanvas = document.createElement('canvas');
              const ctx = outCanvas.getContext('2d');
              ctx.fillStyle = '#ffffff';

              if (rectPx && rectPx.w > 8 && rectPx.h > 8 && canvasEl && canvasEl.width > 0 && canvasEl.height > 0) {
                const scaleX = srcImg.naturalWidth / canvasEl.width;
                const scaleY = srcImg.naturalHeight / canvasEl.height;
                const sx = Math.round(rectPx.x * scaleX);
                const sy = Math.round(rectPx.y * scaleY);
                const sw = Math.max(10, Math.round(rectPx.w * scaleX));
                const sh = Math.max(10, Math.round(rectPx.h * scaleY));
                outCanvas.width = sw;
                outCanvas.height = sh;
                ctx.fillRect(0, 0, sw, sh);
                ctx.drawImage(srcImg, sx, sy, sw, sh, 0, 0, sw, sh);
              } else {
                // Si aucun rectangle tracé, conserve la page entière
                outCanvas.width = srcImg.naturalWidth;
                outCanvas.height = srcImg.naturalHeight;
                ctx.fillRect(0, 0, outCanvas.width, outCanvas.height);
                ctx.drawImage(srcImg, 0, 0);
              }

              const croppedUrl = canvasToCompressedJpeg(outCanvas, 0.85);
              root.innerHTML = '';
              onCroppedDataUrl(croppedUrl, currentPage);
            };
            srcImg.src = pageDataUrl;
          };
        };

        loadPage(currentPage);
      }

      /** Items tolérés : 0 discordance qu'ils soient cochés ou non */
      function scoreQCM(selectedLetters, correctLetters, toleratedLetters = [], allLetters = ['A', 'B', 'C', 'D', 'E']) {
        const sel = new Set(selectedLetters || []);
        const cor = new Set(correctLetters || []);
        const tol = new Set(toleratedLetters || []);
        let discordances = 0;

        for (const l of allLetters) {
          if (tol.has(l)) continue; // toléré : jamais pénalisant coché ou non
          if (sel.has(l) !== cor.has(l)) discordances++;
        }

        if (discordances === 0) return { score: 1, discordances };
        if (discordances === 1) return { score: 0.5, discordances };
        if (discordances === 2) return { score: 0.2, discordances };
        return { score: 0, discordances };
      }

      function scoreQCU(selectedLetter, correctLetters, toleratedLetters = []) {
        if (!selectedLetter) return { score: 0, isExact: false, isTolerated: false };
        const cor = new Set(correctLetters || []);
        const tol = new Set(toleratedLetters || []);
        if (cor.has(selectedLetter)) return { score: 1, isExact: true, isTolerated: false };
        if (tol.has(selectedLetter)) return { score: 1, isExact: false, isTolerated: true };
        return { score: 0, isExact: false, isTolerated: false };
      }

      function getMaxScoreForType(type) {
        return type === 'QROL' ? 7 : 1;
      }

      function shuffleArray(arr) {
        const copy = [...arr];
        for (let i = copy.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [copy[i], copy[j]] = [copy[j], copy[i]];
        }
        return copy;
      }

      function startQuizSession(groupsToRun, config, customEntries = null, scopeLabel = null) {
        let entries = [];

        if (customEntries) {
          entries = customEntries;
        } else {
          for (const g of groupsToRun) {
            const sfObj = getSubFolder(g.semesterId, g.ueId, g.subFolderId);
            for (const q of (g.questions || [])) {
              if (config.typeFilter === 'choice' && q.type !== 'QCM' && q.type !== 'QCU') continue;
              if (config.typeFilter === 'open' && q.type !== 'QROC' && q.type !== 'QROL') continue;
              entries.push({
                groupId: g.id,
                groupTitle: g.title,
                subFolderId: g.subFolderId || null,
                subFolderName: sfObj ? sfObj.name : null,
                question: JSON.parse(JSON.stringify(q))
              });
            }
          }
        }

        if (entries.length === 0) {
          showToast('Aucune question ne correspond à ce filtre.', 'warning');
          return;
        }

        if (config.shuffleQ) entries = shuffleArray(entries);

        const LETTERS = ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H', 'I', 'J'];
        const prepared = entries.map(entry => {
          const q = entry.question;
          const media = normalizeQuestionMedia(q);
          q.imageIds = media.imageIds;
          q.correctionImageIds = media.correctionImageIds;
          q.correctAnswers = media.correctAnswers;
          q.toleratedAnswers = media.toleratedAnswers;

          let displayItems = [];
          if (q.type === 'QCM' || q.type === 'QCU') {
            const base = (q.items || []).map(it => ({ origLetter: it.letter, text: it.text }));
            const ordered = config.shuffleItems ? shuffleArray(base) : base;
            displayItems = ordered.map((it, idx) => ({
              displayLetter: LETTERS[idx] || it.origLetter,
              origLetter: it.origLetter,
              text: it.text
            }));
          }

          return {
            groupId: entry.groupId,
            groupTitle: entry.groupTitle,
            subFolderId: entry.subFolderId || null,
            subFolderName: entry.subFolderName || null,
            question: q,
            displayItems,
            selectedOrigLetters: [],
            textResponse: '',
            validated: false,
            score: null,
            maxScore: getMaxScoreForType(q.type),
            discordances: null,
            editingModelAnswer: false,
            editingNotes: false
          };
        });

        const firstGrp = groupsToRun[0] || {};
        const subIds = Array.from(new Set(prepared.map(p => p.subFolderId).filter(Boolean)));

        state.quiz = {
          meta: {
            semesterId: firstGrp.semesterId || state.nav.semesterId,
            ueId: firstGrp.ueId || state.nav.ueId,
            year: firstGrp.year || state.nav.year,
            session: firstGrp.session || state.nav.session,
            subFolderId: subIds.length === 1 ? subIds[0] : null,
            groupIds: Array.from(new Set(prepared.map(p => p.groupId))),
            groupTitles: scopeLabel ? [scopeLabel] : Array.from(new Set(prepared.map(p => p.groupTitle))),
            isRetryErrors: Boolean(customEntries)
          },
          config,
          questions: prepared,
          currentIndex: 0,
          startedAt: Date.now()
        };

        state.view = 'quiz';
        window.scrollTo({ top: 0, behavior: 'smooth' });
        render();
      }

      function validateCurrentQuizQuestion() {
        const item = state.quiz.questions[state.quiz.currentIndex];
        const q = item.question;

        if (q.type === 'QCM') {
          const allOrig = item.displayItems.map(d => d.origLetter);
          const res = scoreQCM(item.selectedOrigLetters, q.correctAnswers, q.toleratedAnswers, allOrig);
          item.score = res.score;
          item.discordances = res.discordances;
          item.validated = true;
        } else if (q.type === 'QCU') {
          const res = scoreQCU(item.selectedOrigLetters[0] || null, q.correctAnswers, q.toleratedAnswers);
          item.score = res.score;
          item.discordances = res.score === 1 ? 0 : 1;
          item.validated = true;
        } else {
          item.validated = true;
        }
        render();
      }

      async function finishQuizAndSave() {
        const quiz = state.quiz;
        if (!quiz) return;
        const incomplete = quiz.questions.filter(q => !q.validated || q.score === null).length;
        if (incomplete > 0) {
          openConfirmModal(
            'Terminer la série maintenant ?',
            `Il reste ${incomplete} question(s) sans validation ou sans auto-notation (comptées pour 0 pt). Enregistrer votre copie ?`,
            'Enregistrer ma copie',
            () => finalizeQuizSaveNow()
          );
          return;
        }
        await finalizeQuizSaveNow();
      }

      async function finalizeQuizSaveNow() {
        const quiz = state.quiz;
        let totalScore = 0;
        let maxScore = 0;
        const typeBreakdown = {
          QCM: { count: 0, score: 0, max: 0 },
          QCU: { count: 0, score: 0, max: 0 },
          QROC: { count: 0, score: 0, max: 0 },
          QROL: { count: 0, score: 0, max: 0 }
        };

        const details = quiz.questions.map(item => {
          const q = item.question;
          const s = typeof item.score === 'number' ? item.score : 0;
          const m = item.maxScore;
          totalScore += s;
          maxScore += m;
          if (typeBreakdown[q.type]) {
            typeBreakdown[q.type].count += 1;
            typeBreakdown[q.type].score += s;
            typeBreakdown[q.type].max += m;
          }
          return {
            groupId: item.groupId,
            groupTitle: item.groupTitle,
            subFolderId: item.subFolderId,
            subFolderName: item.subFolderName,
            questionId: q.id,
            origNumber: q.origNumber,
            subtitle: q.subtitle || '',
            type: q.type,
            prompt: q.prompt,
            items: q.items || [],
            displayItems: item.displayItems || [],
            correctAnswers: q.correctAnswers || [],
            toleratedAnswers: q.toleratedAnswers || [],
            modelAnswer: q.modelAnswer || '',
            courseNotes: q.courseNotes || '',
            imageIds: q.imageIds || [],
            correctionImageIds: q.correctionImageIds || [],
            selectedOrigLetters: item.selectedOrigLetters || [],
            textResponse: item.textResponse || '',
            score: s,
            maxScore: m,
            discordances: item.discordances
          };
        });

        const scoreOn20 = maxScore > 0 ? (totalScore / maxScore) * 20 : 0;

        const attempt = {
          id: uid('att'),
          createdAt: Date.now(),
          durationSec: Math.max(1, Math.round((Date.now() - quiz.startedAt) / 1000)),
          ...quiz.meta,
          config: quiz.config,
          totalScore: Math.round(totalScore * 100) / 100,
          maxScore: Math.round(maxScore * 100) / 100,
          scoreOn20: Math.round(scoreOn20 * 100) / 100,
          typeBreakdown,
          details
        };

        await saveAttempt(attempt);
        state.lastAttempt = attempt;
        state.quiz = null;
        state.view = 'results';
        window.scrollTo({ top: 0, behavior: 'smooth' });
        showToast('Copie sauvegardée dans l\'historique !', 'success');
        render();
      }

      function launchRetryErrors(attempt) {
        if (!attempt || !Array.isArray(attempt.details)) return;
        const errors = attempt.details.filter(d => d.score < d.maxScore);
        if (errors.length === 0) {
          showToast('Aucune erreur sur cette copie !', 'success');
          return;
        }

        const customEntries = errors.map(d => {
          const grp = state.groups.find(g => g.id === d.groupId);
          const liveQ = grp?.questions?.find(q => q.id === d.questionId);
          return {
            groupId: d.groupId,
            groupTitle: d.groupTitle,
            subFolderId: d.subFolderId || null,
            subFolderName: d.subFolderName || null,
            question: liveQ ? JSON.parse(JSON.stringify(liveQ)) : {
              id: d.questionId,
              origNumber: d.origNumber,
              subtitle: d.subtitle || '',
              type: d.type,
              prompt: d.prompt,
              items: d.items || [],
              correctAnswers: d.correctAnswers || [],
              toleratedAnswers: d.toleratedAnswers || [],
              modelAnswer: d.modelAnswer || '',
              courseNotes: d.courseNotes || '',
              imageIds: d.imageIds || [],
              correctionImageIds: d.correctionImageIds || []
            }
          };
        });

        startQuizSession(
          [{
            semesterId: attempt.semesterId,
            ueId: attempt.ueId,
            year: attempt.year,
            session: attempt.session
          }],
          { shuffleQ: false, shuffleItems: false, typeFilter: 'all' },
          customEntries,
          `Reprise erreurs (${errors.length} Q)`
        );
      }

                </div>
              </div>
            </div>
          </div>
        `;

        document.getElementById('set-close').onclick = () => { root.innerHTML = ''; };
        document.getElementById('btn-demo-from-settings').onclick = async () => {
          root.innerHTML = '';
          await loadDemoSubject();
        };

        document.getElementById('btn-export-json').onclick = () => {
          const payload = {
            version: 2,
            exportedAt: new Date().toISOString(),
            customYearsByUe: state.customYearsByUe,
            groups: state.groups,
            attempts: state.attempts,
            images: state.imageCache
          };
          const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `dfgsm3_annales_v2_${new Date().toISOString().slice(0, 10)}.json`;
          a.click();
          URL.revokeObjectURL(url);
          showToast('Sauvegarde JSON téléchargée !', 'success');
        };

        document.getElementById('inp-import-json').onchange = async (e) => {
          const f = e.target.files[0];
          if (!f) return;
          try {
            const data = JSON.parse(await f.text());
            if (!Array.isArray(data.groups)) throw new Error('Format invalide');

            if (data.customYearsByUe && typeof data.customYearsByUe === 'object') {
              for (const [k, arr] of Object.entries(data.customYearsByUe)) {
                const existing = state.customYearsByUe[k] || [];
                state.customYearsByUe[k] = Array.from(new Set([...existing, ...(arr || [])]));
              }
              await savePreferences();
            }
            if (data.images && typeof data.images === 'object') {
              for (const [imgId, dataUrl] of Object.entries(data.images)) {
                await saveImage(imgId, dataUrl);
              }
            }
            for (const g of data.groups) await saveGroup(g);
            if (Array.isArray(data.attempts)) {
              for (const a of data.attempts) await saveAttempt(a);
            }
            root.innerHTML = '';
            showToast(`Import réussi : ${data.groups.length} groupe(s) importé(s).`, 'success');
            render();
          } catch (err) {
            console.error(err);
            showToast('Fichier JSON invalide.', 'error');
          }
        };
      }

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-5 max-w-2xl">
              ${[1, 2].map(sNum => {
                const cnt = countGroupsFor({ semesterId: sem.id, ueId: ue.id, year, session: sNum });
                const totalQ = getGroupsForSession(sem.id, ue.id, year, sNum).reduce((a, g) => a + (g.questions?.length || 0), 0);
                return `
                  <button type="button" data-select-session="${sNum}"
                    class="group p-6 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 hover:border-blue-500 hover:shadow-md transition text-left">
                    <div class="flex items-center justify-between">
                      <span class="px-3 py-1 rounded-xl text-xs font-extrabold bg-blue-50 dark:bg-blue-950 text-blue-700 dark:text-blue-300">Session ${sNum}</span>
                      <span class="text-xs font-semibold ${cnt > 0 ? 'text-emerald-600 dark:text-emerald-400' : 'text-slate-400'}">
                        ${cnt > 0 ? `${cnt} groupe(s) · ${totalQ} Q` : 'Vide'}
                      </span>
                    </div>
                    <h2 class="text-lg font-bold mt-4 group-hover:text-blue-600 dark:group-hover:text-blue-400">
                      ${sNum === 1 ? 'Session 1 (Examen principal)' : 'Session 2 (Rattrapage)'}
                    </h2>
                    <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">
                      Importer un PDF et router chaque groupe vers la destination souhaitée →
                    </p>
                  </button>
                `;
              }).join('')}
            </div>
          `;
        } else {
          const allSessionGroups = getGroupsForSession(sem.id, ue.id, year, session);
          const totalQSession = allSessionGroups.reduce((a, g) => a + (g.questions?.length || 0), 0);
          const hasSubFolders = ue.subFolders.length > 0;

          const subFolderPills = hasSubFolders ? `
            <div class="flex flex-wrap items-center gap-2 mb-6">
              <button type="button" data-filter-sf=""
                class="px-3.5 py-2 rounded-xl text-xs font-bold border transition ${!subFolderId ? 'bg-[#1E3A5F] text-white border-[#1E3A5F]' : 'bg-white dark:bg-slate-900 text-slate-600 dark:text-slate-300 border-slate-200 dark:border-slate-700 hover:border-blue-500'}">
                Toutes les sous-matières (${allSessionGroups.length})
              </button>
              ${ue.subFolders.map(sf => {
                const sfGroups = allSessionGroups.filter(g => g.subFolderId === sf.id);
                const active = subFolderId === sf.id;
                return `
                  <button type="button" data-filter-sf="${sf.id}"
                    class="px-3.5 py-2 rounded-xl text-xs font-bold border transition ${active ? 'bg-blue-600 text-white border-blue-600' : 'bg-white dark:bg-slate-900 text-slate-600 dark:text-slate-300 border-slate-200 dark:border-slate-700 hover:border-blue-500'}">
                    📁 ${escapeHtml(sf.name)} (${sfGroups.length})
                  </button>
                `;
              }).join('')}
            </div>
          ` : '';

          let contentBlocks = '';
          if (allSessionGroups.length === 0) {
            contentBlocks = `
              <div class="rounded-2xl border-2 border-dashed border-slate-300 dark:border-slate-700 bg-white/70 dark:bg-slate-900/50 p-10 text-center">
                <div class="w-14 h-14 mx-auto rounded-2xl bg-blue-50 dark:bg-blue-950/60 text-blue-600 dark:text-blue-400 flex items-center justify-center mb-4">
                  <svg class="w-7 h-7" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                  </svg>
                </div>
                <h3 class="text-base font-bold">Aucun sujet dans cette session (${escapeHtml(year)} — Session ${session})</h3>
                <p class="text-sm text-slate-500 dark:text-slate-400 max-w-lg mx-auto mt-1">
                  Importez un PDF ici puis affectez librement chaque groupe à la période, UE et sous-matière de votre choix.
                </p>
                <div class="flex flex-wrap justify-center gap-3 mt-6">
                  <button type="button" id="btn-empty-import" class="px-5 py-2.5 rounded-xl text-sm font-bold bg-blue-600 hover:bg-blue-700 text-white shadow-sm">
                    ⬆ Importer un PDF d'annales
                  </button>
                  <button type="button" id="btn-empty-manual" class="px-5 py-2.5 rounded-xl text-sm font-semibold bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-700 hover:border-blue-500">
                    + Créer manuellement
                  </button>
                </div>
              </div>
            `;
          } else if (hasSubFolders) {
            const foldersToRender = subFolderId ? ue.subFolders.filter(sf => sf.id === subFolderId) : ue.subFolders;
            const validSfIds = new Set(ue.subFolders.map(s => s.id));
            const unassigned = !subFolderId ? allSessionGroups.filter(g => !g.subFolderId || !validSfIds.has(g.subFolderId)) : [];

            contentBlocks = `
              <div class="space-y-7">
                ${foldersToRender.map(sf => {
                  const sfGroups = allSessionGroups.filter(g => g.subFolderId === sf.id);
                  const sfTotalQ = sfGroups.reduce((a, g) => a + (g.questions?.length || 0), 0);
                  return `
                    <section class="rounded-2xl bg-white/60 dark:bg-slate-900/40 border border-slate-200 dark:border-slate-800 p-5">
                      <div class="flex flex-wrap items-center justify-between gap-3 mb-4">
                        <div class="flex items-center gap-2.5">
                          <div class="w-9 h-9 rounded-xl bg-blue-50 dark:bg-blue-950/60 text-blue-600 dark:text-blue-400 flex items-center justify-center">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                              <path stroke-linecap="round" stroke-linejoin="round" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z" />
                            </svg>
                          </div>
                          <div>
                            <h2 class="font-extrabold text-base sm:text-lg">${escapeHtml(sf.name)}</h2>
                            <p class="text-xs text-slate-500 dark:text-slate-400">${sfGroups.length} groupe(s) • ${sfTotalQ} question(s)</p>
                          </div>
                        </div>
                        ${sfTotalQ > 0 ? `
                          <button type="button" data-launch-subfolder="${sf.id}"
                            class="px-4 py-2 rounded-xl text-xs sm:text-sm font-bold bg-[#1E3A5F] hover:bg-[#152A45] text-white shadow-sm transition">
                            ▶ Lancer ${escapeHtml(sf.name)} (${sfTotalQ} Q)
                          </button>
                        ` : ''}
                      </div>
                      ${sfGroups.length === 0 ? `
                        <div class="p-5 rounded-xl border border-dashed border-slate-300 dark:border-slate-700 text-center text-xs text-slate-500">
                          Aucun groupe dans <strong>${escapeHtml(sf.name)}</strong> pour cette session.
                        </div>
                      ` : `
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                          ${sfGroups.map(g => renderGroupCard(g)).join('')}
                        </div>
                      `}
                    </section>
                  `;
                }).join('')}

                ${unassigned.length > 0 ? `
                  <section class="rounded-2xl bg-white/60 dark:bg-slate-900/40 border border-slate-200 dark:border-slate-800 p-5">
                    <h2 class="font-extrabold text-base mb-4">Autres groupes</h2>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                      ${unassigned.map(g => renderGroupCard(g)).join('')}
                    </div>
                  </section>
                ` : ''}
              </div>
            `;
          } else {
            contentBlocks = `
              <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                ${allSessionGroups.map(g => renderGroupCard(g)).join('')}
              </div>
            `;
          }

          bodyHtml = `
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6">
              <div>
                <div class="flex items-center gap-2">
                  <span class="px-2.5 py-0.5 rounded-lg text-xs font-extrabold bg-[#1E3A5F] text-white">${escapeHtml(year)}</span>
                  <span class="px-2.5 py-0.5 rounded-lg text-xs font-bold bg-blue-100 dark:bg-blue-900/50 text-blue-800 dark:text-blue-300">Session ${session}</span>
                </div>
                <h1 class="text-xl sm:text-2xl font-extrabold mt-2">${ue.code} — ${escapeHtml(ue.name)}</h1>
              </div>

              <div class="flex flex-wrap gap-2.5">
                <button type="button" id="btn-open-pdf-import"
                  class="px-4 py-2.5 rounded-xl text-sm font-bold bg-blue-600 hover:bg-blue-700 text-white shadow-sm flex items-center gap-2 transition">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" />
                  </svg>
                  Importer un PDF
                </button>
                <button type="button" id="btn-manual-create"
                  class="px-4 py-2.5 rounded-xl text-sm font-semibold bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-700 hover:border-blue-500 transition">
                  + Groupe manuel
                </button>
                ${totalQSession > 0 ? `
                  <button type="button" id="btn-launch-all-session"
                    class="px-4 py-2.5 rounded-xl text-sm font-bold bg-[#1E3A5F] hover:bg-[#152A45] text-white shadow-sm transition">
                    ▶ Toute la session (${totalQSession} Q)
                  </button>
                ` : ''}
              </div>
            </div>

            ${subFolderPills}
            ${contentBlocks}
          `;
        }

        return `
          <div class="flex-1 flex max-w-7xl w-full mx-auto">
            ${renderSidebar()}
            <main class="flex-1 min-w-0 p-4 sm:p-6 lg:p-8">
              ${periodBar}
              ${renderBreadcrumb()}
              ${bodyHtml}
            </main>
          </div>
        `;
      }

      /** Sélecteur de destination par groupe (Période + UE + Sous-matière, année & session partagées) */
      function renderGroupDestinationControls(grp, gIdx) {
        const gSemId = grp.semesterId || state.importDraft.targetPath.semesterId;
        const gSem = getSemester(gSemId) || CURRICULUM[0];
        const gUeId = grp.ueId || gSem.ues[0]?.id;
        const gUe = getUE(gSem.id, gUeId) || gSem.ues[0];
        const subFolders = gUe ? gUe.subFolders : [];

        return `
          <div class="grid grid-cols-1 sm:grid-cols-3 gap-2.5 mt-3">
            <div>
              <label class="block text-[10px] font-bold uppercase tracking-wider text-slate-500 mb-1">Période</label>
              <select data-grp-dest-sem="${gIdx}"
                class="w-full px-2.5 py-2 rounded-xl border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-900 text-xs font-bold">
                ${CURRICULUM.map(s => `<option value="${s.id}" ${s.id === gSem.id ? 'selected' : ''}>${escapeHtml(s.name)}</option>`).join('')}
              </select>
            </div>
            <div>
              <label class="block text-[10px] font-bold uppercase tracking-wider text-slate-500 mb-1">Matière (UE)</label>
              <select data-grp-dest-ue="${gIdx}"
                class="w-full px-2.5 py-2 rounded-xl border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-900 text-xs font-bold">
                ${gSem.ues.map(u => `<option value="${u.id}" ${gUe && u.id === gUe.id ? 'selected' : ''}>${u.code} · ${escapeHtml(u.name)}</option>`).join('')}
              </select>
            </div>
            <div>
              <label class="block text-[10px] font-bold uppercase tracking-wider text-emerald-700 dark:text-emerald-400 mb-1">Sous-matière</label>
              ${subFolders.length > 0 ? `
                <select data-grp-dest-sf="${gIdx}"
                  class="w-full px-2.5 py-2 rounded-xl border-2 border-emerald-400/70 dark:border-emerald-700 bg-white dark:bg-slate-900 text-xs font-bold">
                  ${subFolders.map(sf => `<option value="${sf.id}" ${grp.subFolderId === sf.id ? 'selected' : ''}>📁 ${escapeHtml(sf.name)}</option>`).join('')}
                </select>
              ` : `
                <div class="px-2.5 py-2 rounded-xl border border-slate-200 dark:border-slate-800 bg-slate-100/70 dark:bg-slate-800/40 text-xs text-slate-400">
                  Dossier unique
                </div>
              `}
            </div>
          </div>
        `;
      }

      /** Vue Import PDF & Éditeur avec Undo multi-étapes, routage par groupe et rognage énoncé/correction */
      function renderImportOrEditView() {
        const draft = state.importDraft;
        if (!draft) return '';
        const isEditingExisting = Boolean(draft.editingGroupId);
        const canUndo = state.undoStack.length > 0;

        return `
          <main class="flex-1 max-w-5xl w-full mx-auto p-4 sm:p-6 lg:p-8">
            <div class="flex flex-wrap items-center justify-between gap-3 mb-6">
              <div>
                <button type="button" id="btn-cancel-import" class="text-xs font-semibold text-blue-600 dark:text-blue-400 hover:underline mb-1">
                  ← Retour à la session
                </button>
                <h1 class="text-xl sm:text-2xl font-extrabold">
                  ${isEditingExisting ? 'Modifier le groupe & sa destination' : 'Importer un PDF & Répartir par groupe'}
                </h1>
                <p class="text-xs sm:text-sm text-slate-500 dark:text-slate-400 mt-0.5">
                  Année : <strong class="text-slate-700 dark:text-slate-200">${escapeHtml(draft.targetPath.year)}</strong> •
                  Session : <strong class="text-slate-700 dark:text-slate-200">Session ${draft.targetPath.session}</strong>
                </p>
              </div>

              <div class="flex flex-wrap items-center gap-2">
                <button type="button" id="btn-undo-action" ${!canUndo ? 'disabled' : ''}
                  title="Annuler la dernière modification (Ctrl+Z / Cmd+Z)"
                  class="px-3.5 py-2.5 rounded-xl text-xs sm:text-sm font-bold border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-900 hover:border-blue-500 disabled:opacity-40 transition">
                  ↩ Annuler${canUndo ? ` (${state.undoStack.length})` : ''}
                </button>
                ${draft.groups.length > 0 && !draft.isParsing ? `
                  <button type="button" id="btn-save-import-all"
                    class="px-5 py-2.5 rounded-xl text-sm font-bold bg-emerald-600 hover:bg-emerald-700 text-white shadow-sm transition">
                    ✓ Enregistrer ${isEditingExisting ? 'les modifications' : `(${draft.groups.length} groupe${draft.groups.length > 1 ? 's' : ''})`}
                  </button>
                ` : ''}
              </div>
            </div>

            ${!isEditingExisting ? `
              <div id="pdf-drop-zone" class="mb-6 rounded-2xl border-2 border-dashed border-blue-300 dark:border-blue-800 bg-blue-50/40 dark:bg-blue-950/20 p-6 sm:p-8 text-center transition">
                ${draft.isParsing ? `
                  <div class="max-w-md mx-auto space-y-3">
                    <div class="text-sm font-bold text-[#1E3A5F] dark:text-blue-300">${escapeHtml(draft.parseStatus)}</div>
                    <div class="w-full h-3 rounded-full bg-slate-200 dark:bg-slate-800 overflow-hidden">
                      <div class="h-full bg-blue-600 transition-all duration-300" style="width:${draft.parseProgress}%"></div>
                    </div>
                    <div class="text-xs text-slate-500">${draft.parseProgress} %</div>
                  </div>
                ` : `
                  <input type="file" id="pdf-file-input" accept="application/pdf,.pdf" class="hidden" />
                  <div class="flex flex-col items-center gap-2">
                    <div class="w-12 h-12 rounded-2xl bg-blue-600 text-white flex items-center justify-center shadow">
                      <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" />
                      </svg>
                    </div>
                    <div class="font-bold text-sm sm:text-base">
                      ${draft.pdfName ? `Fichier analysé : ${escapeHtml(draft.pdfName)}` : 'Déposez ici votre fichier PDF d\'annales complet'}
                    </div>
                    <p class="text-xs text-slate-500 dark:text-slate-400 max-w-xl">
                      Chaque groupe dispose de sa propre destination (S1, Mi-partiel, S2, UE, sous-matière), d'un outil de rognage d'énoncé et de zone de correction, et d'un historique Annuler (`Ctrl+Z`).
                    </p>
                    <button type="button" id="btn-trigger-pdf-input" class="mt-2 px-4 py-2 rounded-xl text-xs font-bold bg-[#1E3A5F] hover:bg-[#152A45] text-white transition">
                      ${draft.pdfName ? 'Importer un autre PDF' : 'Sélectionner un fichier PDF'}
                    </button>
                  </div>
                `}
              </div>
            ` : ''}

            ${draft.groups.length > 0 && !draft.isParsing ? `
